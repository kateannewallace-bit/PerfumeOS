          return (
            <g key={d.key}>
              {d.rewear>0&&<rect x={x} y={H-rh-nh} width={bw} height={rh} fill="var(--sage)" opacity={0.65} rx={1}/>}
              {d.newTry>0&&<rect x={x} y={H-nh} width={bw} height={nh} fill="var(--gold)" opacity={0.65} rx={1}/>}
              {i%skip===0&&<text x={x+bw/2} y={H+PB-4} textAnchor="middle" fontSize={8}
                fill="var(--fg-very-soft)" fontFamily="Georgia,serif"
                transform={`rotate(-40,${x+bw/2},${H+PB-4})`}>{d.label}</text>}
              <title>{d.label}: {d.newTry} first wears, {d.rewear} rewears</title>
            </g>
          );
        })}
      </svg>
    );
  };

  // SVG multi-line — families over time
  const FamTimeChart = ({months, topFams, data}) => {
    if (!data.length||!topFams.length) return <p style={{color:'var(--fg-mute)',fontSize:12,fontFamily:'Georgia,serif',marginTop:12}}>Not enough diary data.</p>;
    const W=520,H=100,PL=22,PR=14,PT=10,PB=52;
    const iW=W-PL-PR, iH=H;
    const maxV=Math.max(...data.flatMap(d=>topFams.map(f=>d[f]||0)),1);
    const xS=data.length>1?iW/(data.length-1):0;
    const skip=data.length>10?Math.ceil(data.length/8):1;
    const pts=(fam)=>data.map((d,i)=>[PL+(data.length===1?iW/2:i*xS), PT+(1-(d[fam]||0)/maxV)*iH]);
    return (
      <svg viewBox={`0 0 ${W} ${H+PT+PB}`} style={{width:'100%',display:'block',overflow:'visible'}}>
        {[0,Math.round(maxV/2),maxV].map((v,i)=>{
          const y=PT+(1-v/maxV)*iH;
          return <line key={i} x1={PL} x2={W-PR} y1={y} y2={y} stroke="var(--border)" strokeWidth={0.4} strokeDasharray="3 3"/>;
        })}
        {topFams.map(fam=>{
          const ps=pts(fam);
          const col=CAT_COLORS[fam]||'var(--gold)';
          const d=ps.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
          return (
            <g key={fam}>
              <path d={d} fill="none" stroke={col} strokeWidth={1.6} strokeLinejoin="round" strokeLinecap="round" opacity={0.82}/>
              {ps.map(([x,y],i)=>(
                <circle key={i} cx={x} cy={y} r={2.2} fill={col} opacity={0.9}/>
              ))}
            </g>
          );
        })}
        {/* Merged hover layer: coincident nodes share one tooltip so overlapping
            points all surface, not just the topmost circle. */}
        {(() => {
          const groups = {};
          topFams.forEach((fam)=>pts(fam).forEach(([x,y],i)=>{
            const k=i+'|'+Math.round(y);
            (groups[k]=groups[k]||{x,y,i,items:[]}).items.push(
              `${fam}: ${data[i][fam]||0} wears${data[i]._perf&&data[i]._perf[fam]?' ('+data[i]._perf[fam].replace(/\n/g,', ')+')':''}`
            );
          }));
          return Object.values(groups).map((g,gi)=>(
            <circle key={'h'+gi} cx={g.x} cy={g.y} r={5} fill="transparent" style={{pointerEvents:'all'}}>
              <title>{`${data[g.i].label}\n${g.items.join('\n')}`}</title>
            </circle>
          ));
        })()}
        {data.map((d,i)=>i%skip===0&&(
          <text key={d.key} x={PL+(data.length===1?iW/2:i*xS)} y={H+PT+PB-2}
            textAnchor="middle" fontSize={8} fill="var(--fg-very-soft)" fontFamily="Georgia,serif"
            transform={`rotate(-40,${PL+(data.length===1?iW/2:i*xS)},${H+PT+PB-2})`}>{d.label}</text>
        ))}
      </svg>
    );
  };

  // Sparkline — Rating Journeys
  const Spark = ({history, delta}) => {
    const W=100,H=44;
    const ratings=history.map(h=>h.rating);
    const lo=Math.min(...ratings), hi=Math.max(...ratings);
    const range=Math.max(hi-lo,0.5);
    const pts=history.map((h,i)=>[history.length===1?W/2:(i/(history.length-1))*W, H-((h.rating-lo)/range)*H]);
    const path=pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const col=delta>0?'var(--sage)':'var(--dusty-rose)';
    return (
      <svg viewBox={`-3 -6 ${W+6} ${H+14}`} style={{width:'100%',display:'block',marginBottom:5}}>
        <path d={path} fill="none" stroke={col} strokeWidth={1.5} strokeLinejoin="round" strokeLinecap="round"/>
        {pts.map(([x,y],i)=><circle key={i} cx={x} cy={y} r={2.5} fill={col}/>)}
        <text x={0} y={H+8} fontSize={8} fill="var(--fg-very-soft)" fontFamily="Georgia,serif">{history[0].rating}</text>
        <text x={W} y={H+8} textAnchor="end" fontSize={8} fill="var(--fg-very-soft)" fontFamily="Georgia,serif">{history[history.length-1].rating}</text>
      </svg>
    );
  };

  const maxBatting = houseBatting[0]?.avg||10;
  const maxFamColl = familyCollection[0]?.value||1;
  const maxWorn = mostWorn[0]?.wearCount||1;
  const maxScentDNA = scentDNA[0]?.value||1;

  // Seasonal family mini-bars
  const SeasonPanel = ({label, color, top, total}) => {
    const maxN = top[0]?.n||1;
    return (
      <div style={{flex:'1 1 200px',minWidth:180}}>
        <div style={{fontSize:12,fontFamily:'Georgia,serif',color,fontWeight:600,
          letterSpacing:'0.05em',marginBottom:10,textTransform:'uppercase',fontSize:11}}>{label}</div>
        <div style={{fontSize:10,color:'var(--fg-mute)',fontFamily:'Georgia,serif',marginBottom:10}}>
          {total} wear{total!==1?'s':''}
        </div>
        {top.length===0
          ? <p style={{fontSize:11,color:'var(--fg-mute)',fontFamily:'Georgia,serif'}}>No diary entries.</p>
          : top.map(d=>(
            <div key={d.fam} style={{display:'flex',alignItems:'center',gap:8,marginBottom:7}}>
              <div style={{width:72,textAlign:'right',fontSize:10.5,color:'var(--fg-soft)',flexShrink:0,
                fontFamily:'Georgia,serif',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.label}</div>
              <div style={{flex:1,height:8,background:'var(--bg-soft)',borderRadius:1,overflow:'hidden'}}>
                <div style={{width:`${Math.round((d.n/maxN)*100)}%`,height:'100%',background:color,opacity:0.65}}/>
              </div>
              <div style={{width:28,fontSize:9.5,color:'var(--fg-mute)',textAlign:'right',
                fontFamily:'Georgia,serif',flexShrink:0}}>{d.pct}%</div>
            </div>
          ))
        }
      </div>
    );
  };

  // ROLLING 30-DAY CATEGORY CHART
  // Each wear maps to exactly one dominant category derived from primary + tags.
  // Vote-based: primary notes count 3×, tag-only notes 1×. First-listed category
  // wins ties, so Rose is first (most likely to be a perfume's defining character).
const recentMostWorn = useMemo(() => {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
    const recent = wearLog.filter(e => e.date && new Date(e.date) >= cutoff);
    // Name-based lookup helper for entries with no perfumeId
    const normStr = s => (s||"").toLowerCase()
      .replace(/[éèê]/g,'e').replace(/[àâ]/g,'a').replace(/[îï]/g,'i')
      .replace(/[ôö]/g,'o').replace(/[ùûü]/g,'u').replace(/['']/g,"'")
      .replace(/[^a-z0-9 ']/g," ").replace(/\s+/g," ").trim();
    const findByName = (house, name) => {
      if (!house && !name) return null;
      const qh = normStr(house), qn = normStr(name);
      // Case 1: house present — match by house + name (with partial for concentrations)
      if (qh) {
        let found = perfumes.find(pf => normStr(pf.house) === qh && normStr(pf.name) === qn);
        if (found) return found;
        found = perfumes.find(pf => {
          const pn = normStr(pf.name);
          // qn must contain the full stored name (e.g. log: "Secret Gardenia EDP", stored: "Secret Gardenia")
          // NOT the reverse — prevents "Gardenia" from matching "Secret Gardenia"
          return normStr(pf.house) === qh && pn.length >= 4 && qn.includes(pn);
        });
        if (found) return found;
      }
      // Case 2: house is empty — house name is embedded in the perfume string
      // The combined query must contain the full stored "house name" — not the reverse
      const combined = normStr((house||"") + " " + (name||""));
      return perfumes.find(pf => {
        const pfull = normStr(pf.house + " " + pf.name);
        return pfull.length >= 6 && combined.includes(pfull);
      }) || null;
    };
    // Accumulate wear counts per category
    const counts = {}, order = [], perfumesByCat = {};
    for (const e of recent) {
      const pid = e.perfumeId != null ? Number(e.perfumeId) : null;
      let p = pid != null ? perfMap.get(pid) : null;
      if (!p) p = findByName(e.house, e.perfume);
      const cat = dominantCategory(p);
      if (!counts[cat]) { counts[cat] = 0; order.push(cat); perfumesByCat[cat] = new Map(); }
      counts[cat]++;
      const label = p ? `${p.house} — ${p.name}${p.concentration ? ' ' + p.concentration : ''}` : (e.house ? `${e.house} — ${e.perfume}` : e.perfume);
      if (label && !perfumesByCat[cat].has(label)) perfumesByCat[cat].set(label, p || null);
    }
    return order
      .map(cat => ({ cat, count: counts[cat], perfumes: [...perfumesByCat[cat].entries()].map(([label, p]) => ({ label, p })) }))
      .sort((a,b) => b.count - a.count);
  }, [wearLog, perfMap, perfumes]);

  return (
    <div>
      <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
        <div>
          <h1 className="page-title" style={{marginBottom:4}}>Charts</h1>
          <p className="page-sub" style={{marginTop:0}}>Your collection and diary, by the numbers.</p>
        </div>
        {onRefresh && <button onClick={handleRefresh} disabled={refreshing}
          style={{background:'none',border:'1px solid var(--border)',borderRadius:2,cursor:refreshing?'default':'pointer',
            fontSize:11,color:'var(--fg-mute)',fontFamily:'Georgia,serif',padding:'4px 10px',
            opacity:refreshing?0.5:1,flexShrink:0,alignSelf:'center'}}>
          {refreshing ? 'Refreshing…' : '↻ Refresh'}
        </button>}
      </div>

      <div className="charts-grid">

        {/* What You've Been Wearing — Last 30 Days by Category */}
        {recentMostWorn.length > 0 && (
        <div className="chart-card">
          <div className="chart-card-title">What You've Been Wearing — Last 30 Days</div>
          <div className="chart-card-sub">One dominant character per fragrance, tallied across your recent wears</div>
          {(() => {
            const maxCount = recentMostWorn[0]?.count || 1;
            return recentMostWorn.map((entry) => (
              <div key={entry.cat} style={{marginBottom:14}}>
                <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:3}}>
                  <div style={{flex:1,fontSize:12,fontFamily:'Georgia,serif',color:'var(--fg)',fontWeight:'bold',
                    letterSpacing:'0.02em'}}>{entry.cat}</div>
                  <span style={{fontSize:11,color:'var(--fg-mute)',fontFamily:'Georgia,serif',flexShrink:0}}>{entry.count}×</span>
                </div>
                <div style={{height:4,background:'var(--bg-soft)',borderRadius:1,overflow:'hidden',marginBottom:5}}>
                  <div style={{width:`${Math.round((entry.count/maxCount)*100)}%`,height:'100%',
                    background:'var(--lilac)',opacity:0.7,transition:'width 0.4s'}}/>
                </div>
                {entry.perfumes.length > 0 &&
                  <div style={{fontSize:10,color:'var(--fg-mute)',fontFamily:'Georgia,serif',
                    fontStyle:'italic',letterSpacing:'0.01em',lineHeight:1.6}}>
                    {entry.perfumes.map(({label, p}, i) => (
                      <span key={label}>
                        {i > 0 && ' · '}
                        {p && onSelect
                          ? <span onClick={() => onSelect(p)} style={{cursor:'pointer',textDecoration:'underline',textDecorationStyle:'dotted',textUnderlineOffset:2}}>{label}</span>
                          : label}
                      </span>
                    ))}
                  </div>}
              </div>
            ));
          })()}
        </div>
        )}

        {/* Notes Over Time */}
        <div className="chart-card">
          <div className="chart-card-title">Notes Over Time</div>
          <div className="chart-card-sub">Your most-worn notes tracked month by month — what your nose actually gravitates to</div>
          <NotesTimeChart {...notesOverTime}/>
          <div style={{display:'flex',flexWrap:'wrap',gap:'5px 16px',marginTop:12}}>
            {notesOverTime.topNotes.map((note,i)=>(
              <div key={note} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,fontFamily:'Georgia,serif',color:'var(--fg-soft)'}}>
                <div style={{width:9,height:9,borderRadius:'50%',background:NOTE_PALETTE[i%NOTE_PALETTE.length],flexShrink:0,opacity:0.85}}/>
                {note.charAt(0).toUpperCase()+note.slice(1)}
              </div>
            ))}
          </div>
        </div>

        {/* Scent DNA */}
        {scentDNA.length>0 && (
        <div className="chart-card">
          <div className="chart-card-title">Scent DNA</div>
          <div className="chart-card-sub">Your top notes by total wear count — a snapshot of what your collection is fundamentally made of</div>
          {scentDNA.map(d=><HBar key={d.label} label={d.label} value={d.value} max={maxScentDNA} color="var(--gold)"/>)}
        </div>
        )}

        {/* Note Clusters Over Time */}
        {clusterOverTime.data.length>1 && (
        <div className="chart-card">
          <div className="chart-card-title">Note Clusters Over Time</div>
          <div className="chart-card-sub">Grouped note families tracked month by month — a middle zoom between single notes and broad families</div>
          <NotesTimeChart {...clusterOverTime}/>
          <div style={{display:'flex',flexWrap:'wrap',gap:'5px 16px',marginTop:12}}>
            {clusterOverTime.topNotes.map((c,i)=>(
              <div key={c} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,fontFamily:'Georgia,serif',color:'var(--fg-soft)'}}>
                <div style={{width:9,height:9,borderRadius:'50%',background:NOTE_PALETTE[i%NOTE_PALETTE.length],flexShrink:0,opacity:0.85}}/>
                {c}
              </div>
            ))}
          </div>
        </div>
        )}

        {/* Explorer → Curator */}
        <div className="chart-card">
          <div className="chart-card-title">Explorer → Curator</div>
          <div className="chart-card-sub">First wears vs. rewears each month — are you still collecting or settling in?</div>
          <ExplorerChart data={explorerCurator}/>
        </div>

        {/* Most Worn */}
        {mostWorn.length>0&&(
          <div className="chart-card">
            <div className="chart-card-title">Most Worn</div>
            <div className="chart-card-sub">Your most-reached-for fragrances by diary count</div>
            {mostWorn.map(p=>{
              const lastR=p.ratingHistory?.slice(-1)[0]?.rating;
              return <HBar key={p.id} label={`${p.house} — ${p.name}`} value={p.wearCount} max={maxWorn}
                color="var(--lilac)" sub={lastR!=null?`${p.wearCount}× (${lastR})`:String(p.wearCount)}
                onClick={()=>onSelect(p)}/>;
            })}
          </div>
        )}

        {/* Seasonal Wear Patterns */}
        <div className="chart-card">
          <div className="chart-card-title">Seasonal Wear Patterns</div>
          <div className="chart-card-sub">Which olfactory families you reach for each season — does your nose shift with the weather?</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:28,marginTop:8}}>
            {seasonalData.map(s=><SeasonPanel key={s.key} {...s}/>)}
          </div>
        </div>

        {/* House Batting + Olfactory Families */}
        <div className="chart-row-2">
          <div className="chart-card">
            <div className="chart-card-title">House Batting Averages</div>
            <div className="chart-card-sub">Average diary rating per house (2+ rated wears)</div>
            {houseBatting.length>0
              ? houseBatting.map(d=><HBar key={d.label} label={d.label} value={d.avg} max={maxBatting}
                  color="var(--dusty-rose)" sub={`${d.avg} (${d.n}×)`}/>)
              : <p style={{color:'var(--fg-mute)',fontSize:12,fontFamily:'Georgia,serif',marginTop:12}}>Not enough rated wears yet.</p>}
          </div>
          <div className="chart-card">
            <div className="chart-card-title">Olfactory Families</div>
            <div className="chart-card-sub">How many pieces you own per family — click a bar to see the list</div>
            {familyCollection.map(d=>{
              const isOpen = selectedFam === d.label;
              const INLINE_MAX = 12;
              const famPerfumes = isOpen ? perfumes.filter(p => dominantCategory(p) === d.label)
                .sort((a,b) => a.house.localeCompare(b.house)) : [];
              const overflow = famPerfumes.length > INLINE_MAX;
              const shown = overflow ? famPerfumes.slice(0, INLINE_MAX) : famPerfumes;
              return <div key={d.label}>
                <HBar label={d.label} value={d.value} max={maxFamColl} color={d.color}
                  onClick={() => setSelectedFam(isOpen ? null : d.label)}/>
                {isOpen && <div style={{margin:'4px 0 10px 0',paddingLeft:8,borderLeft:'2px solid var(--border-soft)'}}>
                  {shown.map(p => (
                    <div key={p.id} onClick={() => onSelect(p)}
                      style={{fontSize:11,fontFamily:'Georgia,serif',color:'var(--gold)',
                        cursor:'pointer',padding:'2px 0',lineHeight:1.5}}>
                      {p.house} — {p.name}{p.concentration ? ' ' + p.concentration : ''}
                    </div>
                  ))}
                  {overflow && <div style={{fontSize:11,fontFamily:'Georgia,serif',color:'var(--fg-mute)',
                    fontStyle:'italic',marginTop:4}}>
                    ...and {famPerfumes.length - INLINE_MAX} more
                  </div>}
                </div>}
              </div>;
            })}
          </div>
        </div>

        {/* Olfactory Families Over Time */}
        {famOverTime.data.length>1&&(
          <div className="chart-card">
            <div className="chart-card-title">Olfactory Families Over Time</div>
            <div className="chart-card-sub">Which families you reached for each month — your taste in motion</div>
            <FamTimeChart {...famOverTime}/>
            <div style={{display:'flex',flexWrap:'wrap',gap:'5px 16px',marginTop:12}}>
              {famOverTime.topFams.map(fam=>(
                <div key={fam} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,fontFamily:'Georgia,serif',color:'var(--fg-soft)'}}>
                  <div style={{width:9,height:9,borderRadius:'50%',background:CAT_COLORS[fam]||'var(--gold)',flexShrink:0,opacity:0.85}}/>
                  {fam.charAt(0).toUpperCase()+fam.slice(1)}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Rating Journeys */}
        {journeys.length>0&&(
          <div className="chart-card">
            <div className="chart-card-title">Rating Journeys</div>
            <div className="chart-card-sub">Fragrances that surprised you — first wear to latest</div>
            <div className="journey-grid">
              {journeys.map(p=>(
                <div key={p.id} className="journey-item">
                  <Spark history={p.ratingHistory} delta={p.ratingDelta}/>
                  <div className="journey-name">{p.name}</div>
                  <div className="journey-house">{p.house}</div>
                  <div className="journey-delta" style={{color:p.ratingDelta>0?'var(--sage)':'var(--dusty-rose)'}}>
                    {p.ratingDelta>0?'↑ +':'↓ '}{p.ratingDelta} from {p.ratingHistory[0].rating}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

function InsightsView({ onSelect, wearStats, perfumes }) {
  const enriched = useMemo(() => enrich(perfumes, wearStats), [wearStats, perfumes]);
  const loves = enriched.filter(p => p.preference === "Love").sort((a,b) => b.balScore - a.balScore);
  const avoids = enriched.filter(p => p.status === "Avoid");
  const retries = enriched.filter(p => p.status === "Retry");
  const gems = enriched.filter(p => !p.tried && p.sigScore >= 7).sort((a,b) => b.sigScore - a.sigScore).slice(0, 12);
  const topTrev = enriched.filter(p => p.status !== "Avoid" && p.status !== "Dislike").sort((a,b) => b.safeScore - a.safeScore).slice(0, 8);
  const forgotten = enriched.filter(p => p.isForgottenLove).slice(0, 8);
  const mostWorn = enriched.filter(p => p.wearCount > 0).sort((a,b) => b.wearCount - a.wearCount).slice(0, 8);

  const Sec = ({ title, sub, items }) => items.length > 0 && <div className="insight-section">
    <div className="insight-header">
      <div className="insight-title">{title}</div>
      {sub && <div className="insight-sub">{sub}</div>}
    </div>
    <div className="grid">{items.map(p => <Card key={p.id} p={p} onClick={onSelect} />)}</div>
  </div>;

  return <div>
    <h1 className="page-title">Insights</h1>
    <p className="page-sub">Your collection at a glance.</p>

    <div className="stats-grid">
      {[["Total", perfumes.length, "fragrances"],["Tried", perfumes.filter(p=>p.tried).length, "worn"],["Loved", loves.length, "9–10/10"],["Avoid", avoids.length, "hard no"]].map(([l,v,s]) =>
        <div key={l} className="stat">
          <div className="stat-val">{v}</div>
          <div className="stat-lbl">{l}</div>
          <div className="stat-sub">{s}</div>
        </div>
      )}
    </div>

    <Sec title="Forgotten Loves" sub="Rated 9+ but not worn in 30+ days" items={forgotten} />
    <Sec title="Most Worn" sub="Your rotation mainstays" items={mostWorn} />
    <Sec title="The Loves" sub="9–10/10, ranked by balance" items={loves} />
    <Sec title={CONFIG.partnerName ? `${CONFIG.partnerName}'s Picks` : "Partner Picks"} sub={`Highest ${CONFIG.partnerName || "partner"} score`} items={topTrev} />
    <Sec title="Hidden Gems" sub="Untried, high signature match" items={gems} />
    {retries.length > 0 && <Sec title="Retry Queue" sub="Worth another chance" items={retries} />}

    {avoids.length > 0 && <div className="insight-section">
      <div className="insight-header">
        <div className="insight-title">Hard No</div>
        <div className="insight-sub">Suppressed from all recommendations</div>
      </div>
      <div className="chip-row">{avoids.map(p =>
        <button key={p.id} className="avoid-chip" onClick={() => onSelect(p)}>{p.house} — {p.name}</button>
      )}</div>
    </div>}
  </div>;
}


function AddPerfumeView({ onAdd, perfumes }) {
  const [form, setForm] = useState({
    house: '', name: '', concentration: '',
    family: '', notes: '', myNotes: '',
    rating: '', tried: false,
    tagsMode: 'auto',  // 'auto' or 'manual'
    manualTags: [],
  });
  const [saved, setSaved] = useState(false);

  const ALL_TAGS = ['violet','iris','lipstick iris','rose','musk','tea','citrus','dry citrus','peach','fig','mint','herbal fresh','green','resinous','powdery'];

  const previewTags = useMemo(() => {
    if (form.tagsMode === 'manual') return form.manualTags;
    return buildTagsFromText(form.notes, form.family);
  }, [form.tagsMode, form.manualTags, form.notes, form.family]);

  const previewScores = useMemo(() => {
    return scoreNewPerfume({
      notes: form.notes,
      family: form.family,
      tags: previewTags,

// ─── DIARY MARKDOWN PARSER ────────────────────────────────────────────────────
// Accepts two formats:
//   1. JSON backup ({"diary":[...],"wishlist":[...]}) — merges diary into wearLog
//   2. Markdown diary in the form:
//        ## YYYY-MM-DD [– House – Perfume]
//        **Perfume:** Name        (or bare line after heading)
//        **House:** Name
//        **Rating:** 8.5
//        **Notes:** free text...
//        **Partner:** positive/negative/—
function RestoreCloudBackup({ onRestored, binId, apiKey }) {
  const [status, setStatus] = React.useState("");
  const [restoring, setRestoring] = React.useState(false);

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      setRestoring(true); setStatus("");
      try {
        const data = JSON.parse(ev.target.result);
        // Validate it looks like a cloud backup
        if (!data.wearLog && !data.userPerfumes) {
          setStatus("✗ This doesn't look like a full cloud backup — missing wearLog or userPerfumes."); setRestoring(false); return;
        }
        // Push directly to JSONBin, bypassing localStorage
        const bid = (binId || localStorage.getItem("cloud_bin_id") || "").trim();
        const key = (apiKey || localStorage.getItem("cloud_api_key") || "").trim();
        if (!bid || !key) { setStatus("✗ No JSONBin credentials — save your Bin ID and Master Key above first."); setRestoring(false); return; }
        const res = await fetch(`${JSONBIN_BASE}/${bid}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": key, "X-Bin-Versioning": "false" },
          body: JSON.stringify({ ...data, _updatedAt: new Date().toISOString() }),
        });
        if (!res.ok) { setStatus(`✗ Push failed — HTTP ${res.status}`); setRestoring(false); return; }
        // Also update localStorage to match
        try {
          if (data.wearLog) localStorage.setItem("perfume_diary", JSON.stringify(data.wearLog));
          if (data.wishlist) localStorage.setItem("perfume_wishlist", JSON.stringify(data.wishlist));
          if (data.userPerfumes) localStorage.setItem("perfume_user_perfumes", JSON.stringify(data.userPerfumes));
          if (data.perfumeEdits) localStorage.setItem("perfume_edits", JSON.stringify(data.perfumeEdits));
        } catch(_) {}
        _setDiaryHighWater((data.wearLog || []).length);
        setStatus(`✓ Restored ${(data.wearLog||[]).length} wear entries and ${(data.userPerfumes||[]).length} perfumes. Reloading data…`);
        if (onRestored) onRestored();
      } catch(err) {
        setStatus(`✗ Error: ${err.message}`);
      }
      setRestoring(false);
      e.target.value = "";
    };
    reader.readAsText(file);
  };

  return <div>
    <label style={{display:"inline-block",cursor:"pointer"}}>
      <span className="btn-ghost" style={{display:"inline-block",pointerEvents:"none"}}>{restoring ? "Restoring…" : "Choose backup file"}</span>
      <input type="file" accept=".json" onChange={handleFile} style={{display:"none"}} />
    </label>
    {status && <div style={{marginTop:10,fontSize:13,color:status.startsWith("✓")?"var(--ok, #4a7c59)":"var(--warn, #c0392b)"}}>{status}</div>}
  </div>;
}

function SettingsView({ syncStatus, onSyncChange }) {
  // JSONBin state
  const [binId, setBinId] = useState(localStorage.getItem("cloud_bin_id") || "");
  const [apiKey, setApiKey] = useState(localStorage.getItem("cloud_api_key") || "");
  const [binTesting, setBinTesting] = useState(false);
  const [binResult, setBinResult] = useState("");
  const [binPushing, setBinPushing] = useState(false);

  const saveBin = () => {
    localStorage.setItem("cloud_bin_id", binId.trim());
    localStorage.setItem("cloud_api_key", apiKey.trim());
    onSyncChange();
    setBinResult("Saved. Reloading from cloud…");
  };
  const testBin = async () => {
    if (!binId.trim() || !apiKey.trim()) { setBinResult("Enter Bin ID and Master Key first."); return; }
    setBinTesting(true); setBinResult("");
    // Save credentials first so the helpers can read them
    localStorage.setItem("cloud_bin_id", binId.trim());
    localStorage.setItem("cloud_api_key", apiKey.trim());
    // Non-destructive round-trip: read existing cloud and write the SAME data back, proving
    // write access without erasing anything. (The old {_test} write REPLACED the whole bin.)
    const existing = await jsonbinLoad();
    const blob = (existing && (Array.isArray(existing.wearLog) || Array.isArray(existing.userPerfumes)))
      ? { ...existing, _allowShrink: true, _updatedAt: new Date().toISOString() }
      : { ..._localStateBlob(), _allowShrink: true };
    const writeRes = await jsonbinPush(blob);
    if (!writeRes.ok) { setBinTesting(false); setBinResult(`✗ Write failed — ${writeRes.reason || writeRes.status || writeRes.error || "unknown error"}`); return; }
    const readData = await jsonbinLoad();
    setBinTesting(false);
    if (readData) setBinResult(`✓ Round-trip OK — bin is readable and writable.`);
    else setBinResult("✗ Write succeeded but read failed. Check Master Key permissions.");
  };
  const pushNow = async () => {
    if (!binId.trim() || !apiKey.trim()) { setBinResult("Save credentials first."); return; }
    setBinPushing(true); setBinResult("");
    localStorage.setItem("cloud_bin_id", binId.trim());
    localStorage.setItem("cloud_api_key", apiKey.trim());
    const res = await cloudSync();
    setBinPushing(false);
    if (res.ok) setBinResult("✓ Pushed local data to the cloud.");
    else setBinResult(`✗ Push failed — ${res.reason || res.status || res.error || "unknown"}`);
  };

  const exportData = () => {
    const diary = JSON.parse(localStorage.getItem("perfume_diary") || "[]");
    const wishlist = JSON.parse(localStorage.getItem("perfume_wishlist") || "[]");
    const data = { diary, wishlist, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const u = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = u;
    a.download = `perfume-os-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(u);
  };

  return <div>
    <h1 className="page-title">Settings</h1>
    <p className="page-sub">{syncStatus}</p>

    {/* ── Supabase ── */}
    <div className="settings-card">
      <h2 className="settings-h">Cloud Sync <span style={{fontSize:11,fontWeight:400,color:"var(--gold)",letterSpacing:"0.08em",marginLeft:8}}>SUPABASE</span></h2>
      <p style={{fontSize:13,color:"var(--fg-mute)",marginBottom:12,lineHeight:1.6}}>Your diary syncs automatically to a Supabase database on every change — no keys or setup to enter. It also self-heals: anything saved locally while offline pushes up next time the app loads.</p>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
        <span style={{fontSize:13,fontWeight:600}}>Status:</span>
        <span style={{fontSize:13,color:"var(--fg)"}}>{syncStatus}</span>
      </div>
      <div style={{fontSize:12,color:"var(--fg-very-soft)",marginBottom:14,wordBreak:"break-all"}}>Backend: {supabaseConfigured() ? CONFIG.supabaseUrl.replace("https://","") : "not configured"}</div>
      <div className="form-actions">
        <button className="btn-ghost" onClick={pushNow} disabled={binPushing}>{binPushing ? "Syncing…" : "Sync now"}</button>
      </div>
      {binResult && <div className={`test-result ${binResult.startsWith("✓") ? "ok" : binResult.startsWith("✗") ? "fail" : ""}`}>{binResult}</div>}
    </div>

    <div className="settings-card">
      <h2 className="settings-h">Backup</h2>
      <p>Download your diary and wishlist as a JSON file.</p>
      <div className="form-actions">
        <button className="btn-ghost" onClick={exportData}>Download Backup</button>
      </div>
    </div>

    <div className="settings-card">
      <h2 className="settings-h">Restore Full Cloud Backup</h2>
      <p style={{fontSize:13,color:"var(--fg-mute)",marginBottom:12,lineHeight:1.6}}>Load a full backup JSON file (containing <code style={{background:"var(--bg-soft)",padding:"1px 4px"}}>wearLog</code>, <code style={{background:"var(--bg-soft)",padding:"1px 4px"}}>userPerfumes</code>, etc.) and push it directly to your JSONBin — bypasses localStorage entirely.</p>
      <RestoreCloudBackup onRestored={onSyncChange} binId={binId} apiKey={apiKey} />
    </div>
  </div>;
}

// ─── WHAT TO WEAR TODAY ───────────────────────────────────────────────────────
const SEASONS = ["Spring","Summer","Autumn","Winter"];
const OCCASIONS = ["Casual","Work","Evening","Date Night","Outdoors","Weekend"];
const VIBES = ["Fresh","Cozy","Romantic","Bold","Soft","Energizing"];

function contextScore(p, { season, occasion, vibe }) {
  const tags = new Set((p.tags || []).map(t => t.toLowerCase()));
  const family = (p.family || "").toLowerCase();
  let bonus = 0;

  // Season
  if (season === "Spring") {
    if (tags.has("floral") || tags.has("violet") || tags.has("iris") || tags.has("rose") ||
        tags.has("green") || tags.has("citrus") || tags.has("cherry blossom") || tags.has("lily of the valley")) bonus += 3;
    if (p.mood === "Air") bonus += 1;
  } else if (season === "Summer") {
    if (tags.has("citrus") || tags.has("aquatic") || tags.has("mint") || tags.has("herbal fresh") ||
        tags.has("grapefruit") || tags.has("bergamot") || tags.has("lemon") || tags.has("green")) bonus += 3;
    if (p.mood === "Air") bonus += 2;
    if (tags.has("resinous") || tags.has("oud") || tags.has("leather") || tags.has("smoky")) bonus -= 2;
  } else if (season === "Autumn") {
    if (tags.has("woody") || tags.has("resinous") || tags.has("amber") || tags.has("spicy") ||
        tags.has("leather") || tags.has("vetiver") || tags.has("patchouli") || tags.has("tobacco")) bonus += 3;
    if (p.mood === "Resin" || p.mood === "Classic") bonus += 1;
  } else if (season === "Winter") {
    if (tags.has("resinous") || tags.has("gourmand") || tags.has("vanilla") || tags.has("musk") ||
        tags.has("oud") || tags.has("amber") || tags.has("smoky") || tags.has("incense")) bonus += 3;
    if (p.mood === "Resin") bonus += 2;
    if (tags.has("citrus") || tags.has("aquatic")) bonus -= 1;
  }

  // Occasion
  if (occasion === "Work") {
    bonus += Math.min(p.sigScore || 0, 7) * 0.3;
    if ((p.intScore || 0) > 8) bonus -= 2; // too loud
    if (tags.has("smoky") || tags.has("tobacco") || tags.has("oud")) bonus -= 1;
  } else if (occasion === "Evening") {
    bonus += (p.intScore || 0) * 0.3;
    if (p.mood === "Resin" || p.mood === "Classic") bonus += 2;
  } else if (occasion === "Date Night") {
    bonus += (p.safeScore || 0) * 0.4;
    if (tags.has("rose") || tags.has("jasmine") || tags.has("musk") || tags.has("gardenia")) bonus += 2;
    if (tags.has("vanilla") || tags.has("tonka")) bonus += 1;
  } else if (occasion === "Outdoors") {
    if (tags.has("citrus") || tags.has("green") || tags.has("herbal fresh") || tags.has("mint") ||
        tags.has("aquatic") || tags.has("bergamot")) bonus += 3;
    if (p.mood === "Air") bonus += 2;
  } else if (occasion === "Weekend") {
    bonus += (p.balScore || 0) * 0.2;
  } else if (occasion === "Casual") {
    bonus += (p.balScore || 0) * 0.15;
    if (tags.has("musk") || tags.has("sandalwood") || tags.has("cedar")) bonus += 1;
  }

  // Vibe
  if (vibe === "Fresh") {
    if (tags.has("citrus") || tags.has("mint") || tags.has("green") || tags.has("aquatic") || tags.has("herbal fresh")) bonus += 3;
  } else if (vibe === "Cozy") {
    if (tags.has("vanilla") || tags.has("tonka") || tags.has("amber") || tags.has("resinous") ||
        tags.has("sandalwood") || tags.has("honey") || tags.has("cream")) bonus += 3;
  } else if (vibe === "Romantic") {
    if (tags.has("rose") || tags.has("jasmine") || tags.has("musk") || tags.has("gardenia") ||
        tags.has("peony") || tags.has("iris")) bonus += 3;
    bonus += (p.safeScore || 0) * 0.2;
  } else if (vibe === "Bold") {
    bonus += (p.intScore || 0) * 0.4;
    if (tags.has("oud") || tags.has("leather") || tags.has("smoky") || tags.has("incense")) bonus += 2;
  } else if (vibe === "Soft") {
    if (tags.has("musk") || tags.has("powdery") || tags.has("floral") || tags.has("iris") || tags.has("violet")) bonus += 3;
    if ((p.intScore || 0) > 8) bonus -= 2;
  } else if (vibe === "Energizing") {
    if (tags.has("citrus") || tags.has("grapefruit") || tags.has("bergamot") || tags.has("mint") ||
        tags.has("cardamom") || tags.has("pepper")) bonus += 3;
    if (p.mood === "Air") bonus += 1;
  }

  return bonus;
}

function WearTodayView({ onSelect, wearStats, perfumes }) {
  const [season, setSeason] = useState(() => {
    const m = new Date().getMonth();
    if (m >= 2 && m <= 4) return "Spring";
    if (m >= 5 && m <= 7) return "Summer";
    if (m >= 8 && m <= 10) return "Autumn";
    return "Winter";
  });
  const [occasion, setOccasion] = useState("Casual");
  const [vibe, setVibe] = useState("Fresh");
  // Smart rotation (folded in from the old "Pick" view): boosts forgotten loves and
  // long-neglected favourites so you cycle through the collection instead of repeating.
  const [rotate, setRotate] = useState(true);

  const enriched = useMemo(() => enrich(perfumes, wearStats), [wearStats, perfumes]);

  const forgottenCount = useMemo(() => enriched.filter(p => p.isForgottenLove).length, [enriched]);

  const [ranked, setRanked] = useState([]);
  useEffect(() => {
    const ctx = { season, occasion, vibe };
    const result = enriched
      .filter(p => p.status !== "Avoid" && p.status !== "Dislike" && p.preference !== "Dislike")
      .map(p => {
        // Context is the primary signal — multiply it so the right-for-right-now perfume wins.
        // balScore is a tiebreaker. Love gives a small nudge. Overworn gets a gentle penalty.
        // Rotation (optional) boosts forgotten loves + long-neglected high-raters.
        const ctxBonus = contextScore(p, ctx);
        const base = (p.balScore || 0) * 0.4;
        const overwornPenalty = p.isOverworn ? -3 : 0;
        const lovePref = p.preference === "Love" ? 1 : 0;
        const rotationBonus = rotate
          ? ((p.isForgottenLove ? 4 : 0) + (p.daysAgo != null && p.daysAgo > 60 && p.rating >= 8 ? 2 : 0))
          : 0;
        const total = ctxBonus * 2 + base + overwornPenalty + lovePref + rotationBonus;
        return { ...p, todayScore: total, ctxBonus };
      })
      .sort((a, b) => b.todayScore - a.todayScore)
      .slice(0, 12);
    setRanked(result);
  }, [enriched, season, occasion, vibe, rotate]);

  const top = ranked[0];

  return <div>
    <h1 className="page-title">What to Wear Today</h1>
    <p className="page-sub">Tell me the context — I'll rank your collection for right now.</p>

    {rotate && forgottenCount > 0 && (
      <div className="banner">
        <strong>{forgottenCount} forgotten love{forgottenCount === 1 ? "" : "s"}</strong> — favourites rated 9+ you haven't worn in 30+ days are boosted below.
      </div>
    )}

    <div className="context-group">
      <div className="context-group-label">Season</div>
      <div className="context-chips">
        {SEASONS.map(s => <button key={s} className={`ctx-chip ${season === s ? "active" : ""}`} onClick={() => setSeason(s)}>{s}</button>)}
      </div>
    </div>

    <div className="context-group">
      <div className="context-group-label">Occasion</div>
      <div className="context-chips">
        {OCCASIONS.map(o => <button key={o} className={`ctx-chip ${occasion === o ? "active" : ""}`} onClick={() => setOccasion(o)}>{o}</button>)}
      </div>
    </div>

    <div className="context-group">
      <div className="context-group-label">Vibe</div>
      <div className="context-chips">
        {VIBES.map(v => <button key={v} className={`ctx-chip ${vibe === v ? "active" : ""}`} onClick={() => setVibe(v)}>{v}</button>)}
      </div>
    </div>

    <div className="context-group" style={{marginBottom: 28}}>
      <div className="context-group-label">Rotation</div>
      <div className="context-chips">
        <button className={`ctx-chip ${rotate ? "active" : ""}`} onClick={() => setRotate(r => !r)}>↩ Favor neglected &amp; forgotten loves</button>
      </div>
    </div>

    {top && (
      <div className="surprise-card" style={{marginBottom: 28}}>
        <div className="surprise-label">Top Pick for {season} · {occasion} · {vibe}</div>
        <div className="surprise-house">{top.house}</div>
        <div className="surprise-name">{top.name}</div>
        {top.concentration && <div className="surprise-conc">{top.concentration}</div>}
        <div className="tag-row centered" style={{justifyContent:"center",marginBottom:8}}>
          {(top.tags || []).slice(0,5).map(t => <Tag key={t} tag={t} />)}
        </div>
        {top.myNotes && <div className="surprise-quote">{top.myNotes}</div>}
        <div className="surprise-rating" style={{color:"var(--gold)"}}>
          {top.rating != null ? `${top.rating}/10` : ""}
          {top.isForgottenLove && " · ↩ Forgotten Love"}
        </div>
        <div className="surprise-actions">
          <button className="btn-primary" onClick={() => onSelect(top)}>Details</button>
        </div>
      </div>
    )}

    <div className="result-count">{ranked.length} ranked for your context</div>
    <div className="grid">
      {ranked.map((p, i) => {
        let annotation = null;
        if (i === 0) annotation = `✦ Today's Pick`;
        else if (p.isForgottenLove) annotation = "↩ Forgotten Love";
        else if (p.ctxBonus >= 5) annotation = "Great fit";
        return <Card key={p.id} p={p} onClick={onSelect} annotation={annotation} />;
      })}
    </div>
  </div>;
}

// ─── SAMPLE QUEUE ─────────────────────────────────────────────────────────────
// A shuffled run through every untried perfume so nothing gets skipped in favour of
// comfort picks. Impressions save to each perfume's permanent notes and the check-off
// marks it "tried" — BOTH go through perfumeEdits (onEditPerfume), which syncs to the
// cloud bin, so everything persists across devices with no localStorage. Anything
// logged in the diary (wearCount > 0) also auto-drops from the queue.
function SampleQueueItem({ p, rank, onSelect, onSaveNote, onSetRating, onMarkSampled }) {
  const [text, setText] = useState(p.myNotes || "");
  const [saved, setSaved] = useState(false);
  const dirty = text !== (p.myNotes || "");
  const save = () => { if (dirty) { onSaveNote(p.id, text); setSaved(true); setTimeout(() => setSaved(false), 1500); } };
  return <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
    <div style={{ flexShrink: 0, width: 26, height: 26, borderRadius: 13, background: "var(--gold)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, marginTop: 6 }}>{rank}</div>
    <div style={{ flex: 1, minWidth: 0 }}>
      <Card p={p} onClick={onSelect} />
      <textarea
        value={text}
        onChange={e => setText(e.target.value)}
        onBlur={save}
        placeholder="Quick impressions… (saved to this perfume's notes — tart? too sweet? washed it off?)"
        rows={2}
        style={{ width: "100%", marginTop: 6, padding: "8px 10px", borderRadius: 8, border: "1px solid var(--border-soft, #ddd)", fontFamily: "inherit", fontSize: 13, resize: "vertical", boxSizing: "border-box", background: "var(--bg, #fff)", color: "inherit" }}
      />
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 6, flexWrap: "wrap" }}>
        <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--fg-mute, #888)" }}>
          Rating
          <input
            type="number" min="0" max="10" step="0.5"
            value={p.rating != null ? p.rating : ""}
            onChange={e => onSetRating(p.id, e.target.value === "" ? null : parseFloat(e.target.value))}
            placeholder="–"
            style={{ width: 56, padding: "5px 8px", borderRadius: 8, border: "1px solid var(--border-soft, #ddd)", fontFamily: "inherit", fontSize: 13, background: "var(--bg, #fff)", color: "inherit" }}
          />
          <span style={{ color: "var(--fg-soft, #aaa)" }}>/10</span>
        </label>
        <button className="btn-ghost" style={{ fontSize: 12, padding: "6px 14px" }} onClick={() => { if (dirty) onSaveNote(p.id, text); onMarkSampled(p.id); }}>✓ Mark sampled</button>
        {dirty && <button className="btn-ghost" style={{ fontSize: 12, padding: "6px 14px" }} onClick={save}>Save note</button>}
        {saved && <span style={{ fontSize: 12, color: "var(--sage)" }}>Saved ✓</span>}
      </div>
    </div>
  </div>;
}

function SampleQueueView({ onSelect, perfumes, onEditPerfume }) {
  const [salt, setSalt] = useState(1);
  const [limit, setLimit] = useState(25);

  const untried = useMemo(
    () => perfumes.filter(p => !p.tried && !(p.wearCount > 0) && p.status !== "Avoid"),
    [perfumes]
  );

  // Deterministic pseudo-random order from a hash of (id, salt): stable within a
  // session and identical across devices for the same salt — no storage needed.
  const queue = useMemo(() => {
    const h = id => { const x = Math.sin((id + 1) * 9301 + salt * 49297) * 233280; return x - Math.floor(x); };
    return [...untried].sort((a, b) => h(a.id) - h(b.id));
  }, [untried, salt]);

  const saveNote = (id, text) => onEditPerfume(id, { myNotes: text });
  const setRating = (id, n) => onEditPerfume(id, n == null
    ? { rating: null }
    : { rating: n, preference: prefFromRating(n), status: prefFromRating(n) });
  const markSampled = (id) => onEditPerfume(id, { tried: true });
  const reshuffle = () => { setSalt(s => s + 1); setLimit(25); };

  const visible = queue.slice(0, limit);

  return <div>
    <h1 className="page-title">Sample Queue</h1>
    <p className="page-sub">A shuffled run through everything you haven't tried. Jot an impression (saved to the perfume's notes) and check it off — all synced across your devices.</p>

    <div className="inline-row" style={{ justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
      <span className="filter-summary">{queue.length} left to sample</span>
      <button className="btn-ghost" onClick={reshuffle}>↻ Reshuffle</button>
    </div>

    {queue.length === 0 && <p className="empty">Nothing left to sample — you've tried everything (or logged it in your diary). 🎉</p>}

    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {visible.map((p, i) => (
        <SampleQueueItem key={p.id} p={p} rank={i + 1} onSelect={onSelect} onSaveNote={saveNote} onSetRating={setRating} onMarkSampled={markSampled} />
      ))}
    </div>

    {queue.length > visible.length && (
      <button className="btn-ghost" style={{ marginTop: 16 }} onClick={() => setLimit(l => l + 25)}>Show 25 more ({queue.length - visible.length} left)</button>
    )}
  </div>;
}

// ─── APP SHELL ────────────────────────────────────────────────────────────────
function App() {
  useEffect(() => {
    if (CONFIG.accentColor) document.documentElement.style.setProperty("--gold", CONFIG.accentColor);
    if (CONFIG.appTitle) document.title = CONFIG.appTitle;
  }, []);
  const [view, setView] = useState("today");
  const [selected, setSelected] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [wearLog, setWearLog] = useState(WEAR_LOG_SEED);
  const [wishlist, setWishlist] = useState(activeWishlistSeed);
  const [userPerfumes, setUserPerfumes] = useState([]);
  const [perfumeEdits, setPerfumeEdits] = useState({});
  const perfumes = useMemo(() => {
    const seedIds = new Set(PERFUMES_SEED.map(p => p.id));
    const seedNames = new Set(PERFUMES_SEED.map(p => p.fullName.toLowerCase()));
    // Fix: filter by name only (not ID), and reassign IDs that collide with seed.
    // This recovers user-added perfumes whose IDs happen to overlap with seed IDs.
    // normalizeHouseName handles spelling variants like "parfums" vs "perfumes"
    const normalizeHouseName = s => s.replace(/parfums/gi,'perfumes').replace(/\s+/g,' ').trim();
    const seedNamesNorm = new Set(PERFUMES_SEED.map(p => normalizeHouseName(p.fullName.toLowerCase())));
    const allUserIds = new Set(userPerfumes.map(p => p.i || 0)); // p.i is the raw id field (compact format)
    let nextAvailId = Math.max(...seedIds, ...allUserIds) + 1;
    const seenUserNames = new Set();
    const filteredUser = userPerfumes.map(normalizePerfume)
      .filter(p => {
        const name = normalizeHouseName(p.fullName.toLowerCase());
        if (seedNamesNorm.has(name) || seenUserNames.has(name)) return false;
        seenUserNames.add(name);
        return true;
      })
      .map(p => seedIds.has(p.id) ? { ...p, id: nextAvailId++ } : p);
    const base = [...PERFUMES_SEED, ...filteredUser];
    const withEdits = base.map(p => {
      const ed = perfumeEdits[p.id];
      return ed ? { ...p, ...ed } : p;
    });
    const resolvedLog = wearLog.map(e => attachPerfumeIdToEntry(normalizeWearEntry(e), withEdits));
    const stats = computeWearStats(resolvedLog);
    return enrich(withEdits, stats);
  }, [userPerfumes, perfumeEdits, wearLog]);
  const [syncStatus, setSyncStatus] = useState("Local storage");
  const [loaded, setLoaded] = useState(false);

  const loadAll = useCallback(async () => {
    if (cloudConfigured()) {
      const data = await cloudLoad();
      if (data) {
        // For keys missing from cloud, fall back to localStorage rather than defaulting to empty
        const localEdits = (() => { try { return JSON.parse(localStorage.getItem("perfume_edits") || "{}"); } catch(e) { return {}; } })();
        const localPerfumes = (() => { try { return JSON.parse(localStorage.getItem("perfume_user_perfumes") || "[]"); } catch(e) { return []; } })();
        const localWishlist = (() => { try { return JSON.parse(localStorage.getItem("perfume_wishlist") || "[]"); } catch(e) { return []; } })();
        // Merge: keep any LOCAL diary entries that never reached the cloud (e.g. a wear
        // logged while the push was failing) so a stale cloud copy can't clobber them.
        const localDiary = (() => { try { return JSON.parse(localStorage.getItem("perfume_diary") || "[]"); } catch(e) { return []; } })();
        const cloudWear = data.wearLog || [];
        const _wkey = e => `${e.date}|${(e.house||"").toLowerCase().trim()}|${(e.perfume||"").toLowerCase().trim()}`;
        const _cloudKeys = new Set(cloudWear.map(_wkey));
        const _localOnly = localDiary.filter(e => !_cloudKeys.has(_wkey(e)));
        const resolvedWear = [...cloudWear, ..._localOnly];
        const resolvedWishlist = data.wishlist || localWishlist;
        const resolvedUserPerfumes = data.userPerfumes && data.userPerfumes.length ? data.userPerfumes : localPerfumes;
        const resolvedEdits = data.perfumeEdits && Object.keys(data.perfumeEdits).length ? data.perfumeEdits : localEdits;
        // Wishlist tombstones from the cloud — mirror locally BEFORE building the
        // seed so removed built-in items stay removed on this device too.
        const resolvedWishlistRemoved = Array.isArray(data.wishlistRemoved) ? data.wishlistRemoved : _loadWishlistRemoved();
        try { localStorage.setItem("perfume_wishlist_removed", JSON.stringify(resolvedWishlistRemoved)); } catch(e) {}
        setWearLog([...WEAR_LOG_SEED, ...resolvedWear.map(normalizeWearEntry)]);
        setWishlist([...activeWishlistSeed(), ...resolvedWishlist]);
        setUserPerfumes(resolvedUserPerfumes);
        setPerfumeEdits(resolvedEdits);
        // Mirror cloud data back into localStorage so "Push Now" never overwrites
        // the cloud with a stale local snapshot.
        try {
          localStorage.setItem("perfume_diary", JSON.stringify(resolvedWear));
          localStorage.setItem("perfume_wishlist", JSON.stringify(resolvedWishlist));
          localStorage.setItem("perfume_user_perfumes", JSON.stringify(resolvedUserPerfumes));
          localStorage.setItem("perfume_edits", JSON.stringify(resolvedEdits));
        } catch(e) {}
        // Self-heal: if we recovered local-only entries the cloud didn't have, push them
        // up now so the diary reconciles itself once you're on a network that allows the
        // keyed request — no manual push needed.
        if (_localOnly.length > 0) {
          setSyncStatus("Syncing recovered entries…");
          cloudSync()
            .then(r => setSyncStatus(r && r.ok ? "✓ Synced" : "⚠ Saved locally · not synced"))
            .catch(() => setSyncStatus("⚠ Saved locally · not synced"));
        } else {
          setSyncStatus("✓ Synced");
        }
        setLoaded(true); return;
      }
      setSyncStatus("⚠ Cloud unreachable · loading local backup");
    } else {
      setSyncStatus("Local · set up sync in Settings");
    }
    try {
      const d = JSON.parse(localStorage.getItem("perfume_diary") || "[]");
      const w = JSON.parse(localStorage.getItem("perfume_wishlist") || "[]");
      const p = JSON.parse(localStorage.getItem("perfume_user_perfumes") || "[]");
      const ed = JSON.parse(localStorage.getItem("perfume_edits") || "{}");
      setWearLog([...WEAR_LOG_SEED, ...d.map(normalizeWearEntry)]);
      setWishlist([...activeWishlistSeed(), ...w]);
      setUserPerfumes(p);
      setPerfumeEdits(ed);
    } catch (e) {}
    setLoaded(true);
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  // Auto-push helper: pushes the full local state to the cloud and reflects the
  // outcome in the sync status, so a manual "Push Now" is never needed.
  const pushWithStatus = useCallback(async () => {
    if (!cloudConfigured()) return;
    setSyncStatus("Saving…");
    try {
      const res = await cloudSync();
      setSyncStatus(res && res.ok ? "✓ Synced" : "⚠ Saved locally · not synced");
    } catch (e) { setSyncStatus("⚠ Saved locally · not synced"); }
  }, []);

  const addWearEntry = useCallback((entry) => {
    const matched = attachPerfumeIdToEntry(entry, perfumes);
    setWearLog(prev => {
      const next = [...prev, matched];
      const user = next.filter(e => !WEAR_LOG_SEED.includes(e));
      try { localStorage.setItem("perfume_diary", JSON.stringify(user)); } catch (e) {}
      pushWithStatus();
      return next;
    });
  }, [perfumes]);

  const editWearEntry = useCallback((oldEntry, newEntry) => {
    // Re-resolve the collection match on every edit so a corrected concentration
    // (e.g. an EDT that was logged onto the EDP) actually re-points the entry.
    const { perfumeId, fuzzy, unmatched, ...rest } = newEntry;
    const rematched = attachPerfumeIdToEntry(rest, perfumes);
    setWearLog(prev => {
      const idx = prev.indexOf(oldEntry);
      if (idx === -1) return prev;
      const next = [...prev];
      next[idx] = rematched;
      const user = next.filter(e => !WEAR_LOG_SEED.includes(e));
      try { localStorage.setItem("perfume_diary", JSON.stringify(user)); } catch (e) {}
      pushWithStatus();
      return next;
    });
  }, [perfumes]);

  const deleteWearEntry = useCallback((entry) => {
    setWearLog(prev => {
      const next = prev.filter(e => e !== entry);
      const user = next.filter(e => !WEAR_LOG_SEED.includes(e));
      try { localStorage.setItem("perfume_diary", JSON.stringify(user)); } catch (e) {}
      pushWithStatus();
      return next;
    });
  }, []);

  const editPerfume = useCallback((id, updates) => {
    setPerfumeEdits(prev => {
      const next = { ...prev, [id]: { ...(prev[id] || {}), ...updates } };
      try { localStorage.setItem("perfume_edits", JSON.stringify(next)); } catch (e) {}
      cloudSync("edit_perfume", { id, updates });
      return next;
    });
  }, []);

  const addWishlistItem = useCallback((item) => {
    setWishlist(prev => {
      const next = [...prev, item];
      const user = next.filter(w => !WISHLIST_SEED.includes(w));
      try { localStorage.setItem("perfume_wishlist", JSON.stringify(user)); } catch (e) {}
      cloudSync("add_wishlist", item);
      return next;
    });
  }, []);

  const addPerfume = useCallback((compactPerfume) => {
    setUserPerfumes(prev => {
      const next = [...prev, compactPerfume];
      try { localStorage.setItem("perfume_user_perfumes", JSON.stringify(next)); } catch (e) {}
      cloudSync("add_perfume", compactPerfume);
      return next;
    });
  }, []);

  const removeWishlistItem = useCallback((idx) => {
    setWishlist(prev => {
      const removedItem = prev[idx];
      const next = prev.filter((_, i) => i !== idx);
      const user = next.filter(w => !WISHLIST_SEED.includes(w));
      try { localStorage.setItem("perfume_wishlist", JSON.stringify(user)); } catch (e) {}
      // If a built-in (seed) item was removed, tombstone it so it doesn't come back
      // on the next load. The tombstone list is included in the cloud push blob, so
      // the removal persists across devices.
      if (removedItem && WISHLIST_SEED.includes(removedItem)) {
        try {
          const removed = _loadWishlistRemoved();
          const k = _wlKey(removedItem);
          if (!removed.includes(k)) {
            removed.push(k);
            localStorage.setItem("perfume_wishlist_removed", JSON.stringify(removed));
          }
        } catch (e) {}
      }
      cloudSync("set_wishlist", user);
      return next;
    });
  }, []);

  const resolvedWearLog = useMemo(
    () => {
      const mapped = wearLog.map(e => {
        const norm = normalizeWearEntry(e);
        // Seed entries carry authoritative IDs baked into the bundled file.
        // Re-resolve user/cloud entries from scratch (clear any stored perfumeId)
        // so concentration-aware matching applies to them — this fixes entries
        // like "Fleur de Peau EDT" that were previously folded onto the EDP.
        const toMatch = WEAR_LOG_SEED.includes(e) ? norm : { ...norm, perfumeId: null };
        return attachPerfumeIdToEntry(toMatch, perfumes);
      });
      // Dedup guard: the bundled diary (WEAR_LOG_SEED) and the cloud diary can hold
      // the same wears. Collapse identical (date + perfume + rating) entries so counts
      // never double when both sources are present. Unmatched entries (no perfumeId)
      // are kept as-is since they don't contribute to stats.
      const seen = new Set();
      return mapped.filter(e => {
        if (e.perfumeId == null) return true;
        const k = e.date + '|' + e.perfumeId + '|' + (e.rating ?? '');
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    },
    [wearLog, perfumes]
  );
  const wearStats = useMemo(() => computeWearStats(resolvedWearLog), [resolvedWearLog]);

  const NAV = [
    { k: "today", l: "Wear Today" },
    { k: "sample", l: "Sample Queue" },
    { k: "collection", l: "Collection" },
    { k: "taxonomy", l: "Taxonomy" },
    { k: "similar", l: "Similar" },
    { k: "compare", l: "Compare" },
    { k: "diary", l: "Diary" },
    { k: "wishlist", l: "Wishlist" },
    { k: "add", l: "Add Perfume" },
    { k: "charts", l: "Charts" },
    { k: "insights", l: "Insights" },
    { k: "settings", l: "Settings" },
  ];

  const go = (k) => { setView(k); setMenuOpen(false); };

  return <div className="app">
    <nav className="nav">
      <div className="nav-inner">
        <div className="logo" onClick={() => go("today")}>{CONFIG.appTitle}</div>
        <button className="menu-btn" onClick={() => setMenuOpen(m => !m)} aria-label="Menu">
          {menuOpen ? "×" : "☰"}
        </button>
      </div>
      <div className={`nav-links ${menuOpen ? "open" : ""}`}>
        {NAV.map(({ k, l }) =>
          <button key={k} className={`nav-link ${view === k ? "active" : ""}`} onClick={() => go(k)}>{l}</button>
        )}
      </div>
    </nav>

    <main className="main">
      {!loaded && <div className="loading">Loading…</div>}
      {loaded && view === "today" && <WearTodayView onSelect={setSelected} wearStats={wearStats} perfumes={perfumes} />}
      {loaded && view === "sample" && <SampleQueueView onSelect={setSelected} perfumes={perfumes} onEditPerfume={editPerfume} />}
      {loaded && view === "collection" && <CollectionView onSelect={setSelected} wearStats={wearStats} perfumes={perfumes} />}
      {loaded && view === "compare" && <CompareView perfumes={perfumes} />}
      {loaded && view === "taxonomy" && <TaxonomyView onSelect={setSelected} perfumes={perfumes} />}
      {loaded && view === "similar" && <SimilarView onSelect={setSelected} perfumes={perfumes} />}
      {loaded && view === "diary" && <DiaryView wearLog={wearLog} onAdd={addWearEntry} onEdit={editWearEntry} onDelete={deleteWearEntry} syncStatus={syncStatus} />}
      {loaded && view === "wishlist" && <WishlistView wishlist={wishlist} onAdd={addWishlistItem} onRemove={removeWishlistItem} />}
      {loaded && view === "charts" && <ChartsView wearLog={resolvedWearLog} perfumes={perfumes} wearStats={wearStats} onRefresh={loadAll} onSelect={setSelected} />}
      {loaded && view === "insights" && <InsightsView onSelect={setSelected} wearStats={wearStats} perfumes={perfumes} />}
      {loaded && view === "add" && <AddPerfumeView onAdd={addPerfume} perfumes={perfumes} />}
      {loaded && view === "settings" && <SettingsView syncStatus={syncStatus} onSyncChange={loadAll} />}
    </main>

    {selected && <Modal p={selected} onClose={() => setSelected(null)} onEdit={editPerfume} perfumes={perfumes} onNavigate={setSelected} />}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
