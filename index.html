<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Perfume OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="perfume-data.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   LA COLLECTION — Mobile-first CSS
   Breakpoints: default mobile < 640px → tablet 640-1024 → desktop > 1024
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  --bg: #faf9f7;
  --bg-card: #fff;
  --bg-soft: #f5f2ee;
  --fg: #1a1a1a;
  --fg-mute: #666;
  --fg-soft: #999;
  --fg-very-soft: #bbb;
  --border: #e8e4df;
  --border-soft: #f0ece8;
  --gold: #c8a97e;
  --sage: #8aaa80;
  --dusty-rose: #c87a7a;
  --lilac: #9b7db8;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: Georgia, 'Times New Roman', serif;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: var(--safe-bottom);
}

select, input, button, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}
button { cursor: pointer; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ─── NAV ─────────────────────────────────────────────────────────────────── */
.nav {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  padding-top: var(--safe-top);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 56px;
}
.logo {
  font-size: 14px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  color: var(--fg);
}
.menu-btn {
  background: none;
  border: none;
  font-size: 24px;
  width: 44px;
  height: 44px;
  color: var(--fg);
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-links {
  display: none;
  flex-direction: column;
  border-top: 1px solid var(--border);
  background: var(--bg);
  max-height: calc(100vh - 56px);
  overflow-y: auto;
}
.nav-links.open {
  display: flex;
}
.nav-link {
  background: none;
  border: none;
  padding: 16px 20px;
  text-align: left;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-soft);
  border-bottom: 1px solid var(--border-soft);
  min-height: 48px;
}
.nav-link.active {
  color: var(--fg);
  background: var(--bg-soft);
  border-left: 3px solid var(--fg);
  padding-left: 17px;
}

/* Tablet+: horizontal nav */
@media (min-width: 640px) {
  .menu-btn { display: none; }
  .nav-links {
    display: flex !important;
    flex-direction: row;
    border-top: none;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0 12px;
    gap: 4px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    max-height: none;
  }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-link {
    padding: 8px 14px;
    font-size: 11px;
    letter-spacing: 0.12em;
    border-bottom: none;
    border-left: none;
    min-height: 0;
    white-space: nowrap;
    position: relative;
  }
  .nav-link.active {
    background: transparent;
    border-left: none;
    padding-left: 14px;
  }
  .nav-link.active::after {
    content: "";
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: -1px;
    height: 1px;
    background: var(--fg);
  }
  .nav-inner {
    padding: 0 24px;
  }
}

/* ─── LAYOUT ──────────────────────────────────────────────────────────────── */
.main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}
@media (min-width: 640px) { .main { padding: 32px 32px 80px; } }
@media (min-width: 1024px) { .main { padding: 40px 48px 80px; } }

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--fg-soft);
  font-style: italic;
}

.page-title {
  font-size: 26px;
  font-weight: 400;
  letter-spacing: 0.03em;
  margin-bottom: 6px;
}
.page-sub {
  font-size: 14px;
  color: var(--fg-soft);
  font-style: italic;
  margin-bottom: 24px;
}
@media (min-width: 640px) {
  .page-title { font-size: 30px; margin-bottom: 6px; }
  .page-sub { margin-bottom: 32px; }
}

/* ─── BANNER ──────────────────────────────────────────────────────────────── */
.banner {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  padding: 14px 16px;
  margin-bottom: 20px;
  font-size: 13px;
  color: var(--fg-mute);
  line-height: 1.6;
}

/* ─── FILTERS ─────────────────────────────────────────────────────────────── */
.search-input {
  width: 100%;
  border: 1px solid #ddd;
  background: #fff;
  padding: 12px 16px;
  font-size: 15px;
  outline: none;
  margin-bottom: 12px;
  min-height: 44px;
}
.search-input:focus { border-color: var(--gold); }

.filter-toggle {
  width: 100%;
  background: #fff;
  border: 1px solid #ddd;
  padding: 12px 16px;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-mute);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  min-height: 44px;
}
.filter-summary {
  font-size: 11px;
  color: var(--gold);
  text-transform: none;
  letter-spacing: 0;
  font-style: italic;
}

.filter-panel {
  display: none;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 20px;
  padding: 16px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
}
.filter-panel.open { display: grid; }

.filter-panel label {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filter-panel select, .filter-panel input {
  border: 1px solid #ddd;
  background: #fff;
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  min-height: 44px;
}

@media (min-width: 640px) {
  .filter-toggle { display: none; }
  .filter-panel {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    padding: 0;
    background: none;
    border: none;
    margin-bottom: 24px;
    align-items: end;
  }
  .filter-panel select, .filter-panel input {
    padding: 8px 12px;
    font-size: 13px;
    min-height: 38px;
  }
}

/* ─── BUTTONS ─────────────────────────────────────────────────────────────── */
.btn-primary {
  background: var(--fg);
  color: #fff;
  border: none;
  padding: 12px 24px;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  min-height: 44px;
  white-space: nowrap;
}
.btn-ghost {
  background: transparent;
  color: var(--fg-mute);
  border: 1px solid #ddd;
  padding: 11px 22px;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  min-height: 44px;
  white-space: nowrap;
}
.toggle {
  border: 1px solid #ddd;
  background: #fff;
  color: var(--fg-mute);
  padding: 10px 16px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  min-height: 44px;
  white-space: nowrap;
}
.toggle.active {
  background: var(--fg);
  color: #fff;
  border-color: var(--fg);
}

/* ─── CHIPS ───────────────────────────────────────────────────────────────── */
.chip-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.chip-row.mode-row { margin-bottom: 28px; }
.chip {
  background: #fff;
  border: 1px solid var(--border);
  padding: 8px 14px;
  font-size: 13px;
  color: var(--fg-mute);
  font-style: italic;
  min-height: 36px;
  border-radius: 0;
}
.chip.active {
  background: var(--fg);
  color: #fff;
  border-color: var(--fg);
  font-style: normal;
}

/* ─── GRID / CARDS ────────────────────────────────────────────────────────── */
.result-count {
  font-size: 13px;
  color: var(--fg-soft);
  margin-bottom: 14px;
}
.result-count .warn { color: var(--dusty-rose); }

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
@media (min-width: 640px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
}

.card {
  background: #fff;
  border: 1px solid var(--border);
  padding: 18px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.card:active, .card:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.card-title {
  flex: 1;
  min-width: 0;
}
.card-house {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-soft);
  margin-bottom: 3px;
}
.card-name {
  font-size: 16px;
  color: var(--fg);
  line-height: 1.3;
  margin-bottom: 2px;
  word-break: break-word;
}
.card-conc {
  font-size: 11px;
  color: var(--fg-very-soft);
  letter-spacing: 0.06em;
}
.card-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  flex-shrink: 0;
}
.card-rating { font-size: 12px; }

.card-annotation {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.card-foot {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border-soft);
}
.mini-lbl {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-very-soft);
  margin-bottom: 2px;
}
.mini-val {
  font-size: 13px;
  color: var(--fg-mute);
}
.sim-badge, .trev-mark {
  margin-left: auto;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.sim-badge { color: var(--fg-soft); background: var(--bg-soft); padding: 3px 8px; }
.trev-mark { color: var(--sage); }

.wear-strip {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-soft);
  font-size: 11px;
  color: var(--fg-soft);
  letter-spacing: 0.04em;
}

/* ─── TAGS ────────────────────────────────────────────────────────────────── */
.tag-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.tag-row.centered { justify-content: center; }
.tag {
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid;
  white-space: nowrap;
}

/* ─── MODAL ───────────────────────────────────────────────────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
}
.modal {
  background: var(--bg);
  width: 100%;
  max-width: 600px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 28px 20px 40px;
  position: relative;
  border-radius: 12px 12px 0 0;
}
@media (min-width: 640px) {
  .overlay { align-items: center; padding: 20px; }
  .modal { max-height: 85vh; padding: 36px 32px; border-radius: 0; }
}

.close-btn {
  position: absolute;
  top: 10px;
  right: 14px;
  background: none;
  border: none;
  font-size: 28px;
  color: var(--fg-soft);
  width: 44px;
  height: 44px;
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 6px;
  padding-right: 30px;
}
.modal-title {
  font-size: 22px;
  font-weight: 400;
  margin-top: 4px;
  word-break: break-word;
}
.modal-rating {
  text-align: right;
  flex-shrink: 0;
}
.rating-big {
  font-size: 22px;
  line-height: 1;
}
.rating-of {
  font-size: 12px;
  color: var(--fg-very-soft);
}
.status-line {
  display: flex;
  align-items: center;
  gap: 5px;
  justify-content: flex-end;
  margin-top: 4px;
  font-size: 11px;
  color: var(--fg-soft);
}

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 16px 0;
}

.scores-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
@media (min-width: 400px) { .scores-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; } }

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--fg-mute);
}

.sec-lbl {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-soft);
  margin-bottom: 4px;
  display: inline-block;
}

.bar {
  display: flex;
  align-items: center;
  gap: 6px;
}
.bar-track {
  flex: 1;
  height: 2px;
  background: var(--border-soft);
  position: relative;
}
.bar-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
}
.bar-val {
  font-size: 11px;
  color: var(--fg-soft);
  min-width: 14px;
  text-align: right;
}

.notes-body {
  font-size: 13px;
  color: var(--fg-mute);
  line-height: 1.7;
  margin-bottom: 14px;
}
.my-notes {
  font-size: 13px;
  line-height: 1.75;
  color: var(--fg-mute);
  font-style: italic;
  background: var(--bg-soft);
  padding: 13px 16px;
  border-left: 2px solid var(--gold);
  margin: 10px 0;
}
.wear-box {
  background: var(--bg-soft);
  padding: 10px 13px;
  margin-bottom: 14px;
  font-size: 12px;
  color: var(--fg-mute);
}
.rating-evo { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.rating-evo strong { margin-right: 4px; }
.evo-pill {
  display: inline-block;
  padding: 2px 8px;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  font-size: 11px;
  color: var(--fg);
}
.evo-pill .evo-date { color: var(--fg-soft); margin-left: 4px; font-size: 10px; }
.evo-delta { margin-left: auto; font-weight: 600; font-size: 12px; }
.evo-delta.up { color: var(--sage); }
.evo-delta.down { color: var(--dusty-rose); }

/* ─── FORMS ───────────────────────────────────────────────────────────────── */
.form-card {
  background: #fff;
  border: 1px solid var(--border);
  padding: 22px 20px;
  margin-bottom: 24px;
}
.form-title {
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 16px;
  color: var(--fg-soft);
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  margin-bottom: 16px;
}
@media (min-width: 640px) {
  .form-grid { grid-template-columns: 1fr 1fr; }
  .form-grid .full-span { grid-column: 1 / -1; }
}
.form-grid label {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.form-grid input, .form-grid textarea {
  border: 1px solid #ddd;
  background: #fff;
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  min-height: 44px;
  width: 100%;
}
.form-grid textarea {
  min-height: 80px;
  resize: vertical;
  font-family: inherit;
}
.form-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.full-label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 16px;
}
.full-select, .mono-input {
  border: 1px solid #ddd;
  background: #fff;
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  min-height: 44px;
  width: 100%;
}
.mono-input { font-family: monospace; font-size: 12px; }

/* ─── ASK VIEW ────────────────────────────────────────────────────────────── */
.ask-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.ask-input-row .search-input { flex: 1; margin-bottom: 0; }

.examples {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  padding: 14px 16px;
  margin-bottom: 24px;
}
.examples .mini-lbl {
  margin-bottom: 8px;
}
.examples .chip-row { margin-bottom: 0; }

.error {
  color: var(--dusty-rose);
  font-size: 14px;
  padding: 12px;
  background: #fdf0f0;
  border: 1px solid #f5d6d6;
  margin-bottom: 20px;
}
.empty { color: var(--fg-very-soft); font-style: italic; padding: 20px 0; }

/* ─── SURPRISE ────────────────────────────────────────────────────────────── */
.surprise-card {
  text-align: center;
  padding: 32px 20px;
  background: #fff;
  border: 1px solid var(--border);
  margin-bottom: 20px;
}
.surprise-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 14px;
}
.surprise-house {
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-soft);
  margin-bottom: 6px;
}
.surprise-name {
  font-size: 28px;
  font-weight: 400;
  margin-bottom: 8px;
  line-height: 1.2;
}
.surprise-conc {
  font-size: 13px;
  color: var(--fg-soft);
  letter-spacing: 0.1em;
  margin-bottom: 14px;
}
.surprise-quote {
  font-size: 13px;
  color: var(--fg-mute);
  font-style: italic;
  max-width: 440px;
  margin: 18px auto;
  line-height: 1.7;
}
.surprise-rating {
  font-size: 22px;
  margin-top: 16px;
}
.surprise-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 24px;
  flex-wrap: wrap;
}
@media (min-width: 640px) {
  .surprise-card { padding: 44px 32px; }
  .surprise-name { font-size: 36px; }
}

/* ─── TAXONOMY ────────────────────────────────────────────────────────────── */
.tab-scroll {
  display: flex;
  overflow-x: auto;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
}
.tab-scroll::-webkit-scrollbar { display: none; }
.tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 12px 14px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-soft);
  white-space: nowrap;
  min-height: 44px;
}
.tab.active {
  border-bottom-color: var(--fg);
  color: var(--fg);
}

.inline-row {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.inline-row select {
  border: 1px solid #ddd;
  background: #fff;
  padding: 8px 12px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  min-height: 40px;
}
.count-muted { font-size: 12px; color: var(--fg-very-soft); }

/* ─── SIMILARITY ──────────────────────────────────────────────────────────── */
.ref-card {
  background: #fff;
  border: 1px solid var(--border);
  padding: 16px 18px;
  margin-bottom: 24px;
}
.ref-name {
  font-size: 16px;
  margin: 4px 0 8px;
}
.ref-meta {
  margin-top: 8px;
  font-size: 12px;
  color: var(--fg-soft);
}

/* ─── DIARY ───────────────────────────────────────────────────────────────── */
.diary-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  align-items: stretch;
}
.diary-controls .search-input { flex: 1; margin-bottom: 0; }

.diary-list { border-top: 1px solid var(--border-soft); }
.diary-entry {
  border-bottom: 1px solid var(--border-soft);
  padding: 16px 0;
}
.diary-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
}
.diary-content { flex: 1; min-width: 0; }
.diary-date {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--fg-very-soft);
  text-transform: uppercase;
  margin-bottom: 4px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.fuzzy-mark, .unmatched-mark {
  font-size: 14px;
  color: var(--fg-very-soft);
}
.diary-name {
  font-size: 15px;
  color: var(--fg);
  margin-bottom: 4px;
  word-break: break-word;
}
.diary-house { color: var(--fg-very-soft); font-size: 13px; }
.diary-conc { color: var(--fg-very-soft); font-size: 11px; }
.diary-notes {
  font-size: 13px;
  color: var(--fg-mute);
  line-height: 1.6;
  font-style: italic;
  margin-top: 4px;
}
.safe-line {
  margin-top: 6px;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-very-soft);
}
.safe-line.trev-positive { color: var(--sage); }
.safe-line.trev-negative, .safe-line.trev-very-negative { color: var(--dusty-rose); }
.diary-rating {
  font-size: 18px;
  flex-shrink: 0;
}

/* ─── WISHLIST ────────────────────────────────────────────────────────────── */
.wishlist-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 640px) {
  .wishlist-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
}
.wish-card {
  background: #fff;
  border: 1px solid var(--border);
  padding: 16px 18px;
  position: relative;
}
.wish-remove {
  position: absolute;
  top: 8px;
  right: 10px;
  background: none;
  border: none;
  font-size: 22px;
  color: var(--fg-very-soft);
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wish-name {
  font-size: 16px;
  color: var(--fg);
  margin: 4px 0;
  word-break: break-word;
}
.wish-note {
  font-size: 12px;
  color: var(--fg-soft);
  font-style: italic;
  margin-top: 8px;
  line-height: 1.5;
}

/* ─── INSIGHTS ────────────────────────────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border);
  margin-bottom: 32px;
}
@media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
.stat {
  background: var(--bg);
  padding: 18px 18px;
}
.stat-val {
  font-size: 28px;
  color: var(--fg);
  line-height: 1;
}
.stat-lbl {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-very-soft);
  margin-top: 4px;
}
.stat-sub {
  font-size: 11px;
  color: var(--fg-very-soft);
  font-style: italic;
}
@media (min-width: 640px) {
  .stat-val { font-size: 34px; }
  .stat { padding: 22px 24px; }
}

.insight-section { margin-bottom: 36px; }
.insight-header { margin-bottom: 16px; }
.insight-title {
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg);
  margin-bottom: 3px;
}
.insight-sub {
  font-size: 12px;
  color: var(--fg-very-soft);
  font-style: italic;
}

.avoid-chip {
  background: #fff;
  border: 1px solid var(--border-soft);
  padding: 7px 14px;
  font-size: 13px;
  color: var(--dusty-rose);
  min-height: 36px;
}

/* ─── SETTINGS ────────────────────────────────────────────────────────────── */
.settings-card {
  background: #fff;
  border: 1px solid var(--border);
  padding: 22px 20px;
  margin-bottom: 20px;
}
@media (min-width: 640px) { .settings-card { padding: 28px; } }
.settings-h {
  font-size: 14px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 16px;
  font-weight: 400;
}
.settings-card p {
  font-size: 13px;
  color: var(--fg-mute);
  margin-bottom: 14px;
  line-height: 1.6;
}
.test-result {
  font-size: 13px;
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--bg-soft);
}
.test-result.ok { color: var(--sage); background: #f0f5ec; }
.test-result.fail { color: var(--dusty-rose); background: #fdf0f0; }

.setup-details {
  margin-top: 20px;
  border-top: 1px solid var(--border-soft);
  padding-top: 16px;
}
.setup-details summary {
  cursor: pointer;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-soft);
  list-style: none;
}
.setup-details summary::-webkit-details-marker { display: none; }
.setup-details summary::before {
  content: "▸ ";
}
.setup-details[open] summary::before {
  content: "▾ ";
}
.setup-details ol {
  padding-left: 24px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--fg-mute);
  margin-top: 14px;
}
.setup-details code {
  background: var(--bg-soft);
  padding: 1px 6px;
  font-size: 12px;
}

/* ─── EDIT CONTROLS ──────────────────────────────────────────────────────── */
.entry-actions {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}
.entry-action-btn {
  background: none;
  border: 1px solid var(--border-soft);
  color: var(--fg-very-soft);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 9px;
  cursor: pointer;
  font-family: inherit;
  min-height: 28px;
}
.entry-action-btn:hover { border-color: var(--gold); color: var(--gold); }
.entry-action-btn.del:hover { border-color: var(--dusty-rose); color: var(--dusty-rose); }

.modal-edit-panel {
  border-top: 1px solid var(--border);
  margin-top: 16px;
  padding-top: 16px;
}
.modal-edit-title {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-soft);
  margin-bottom: 12px;
}

/* ─── WEAR TODAY ──────────────────────────────────────────────────────────── */
.context-group {
  margin-bottom: 20px;
}
.context-group-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-soft);
  margin-bottom: 8px;
}
.context-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.ctx-chip {
  background: #fff;
  border: 1px solid var(--border);
  padding: 8px 14px;
  font-size: 13px;
  color: var(--fg-mute);
  min-height: 36px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.04em;
  transition: all 0.1s;
}
.ctx-chip.active {
  background: var(--fg);
  color: #fff;
  border-color: var(--fg);
}
.ctx-chip:hover:not(.active) {
  border-color: var(--gold);
  color: var(--fg);
}
.today-rank-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 2px;
}
.today-score-badge {
  display: inline-block;
  font-size: 11px;
  color: var(--fg-soft);
  background: var(--bg-soft);
  border: 1px solid var(--border-soft);
  padding: 2px 8px;
  margin-left: auto;
}

select:focus, input:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 1px;

.note-filter {

  border: 1px solid #ddd;
  margin-bottom: 4px;

.note-filter-head {

// ─── CORE NOTE PROCESSING ─────────────────────────────────────────────────────
function processNotes(str) {
  if (!str) return [];

  // Step 1 – Strip tier labels (all formats: "Top notes are", "Top:", "Top note is", etc.)
  let s = str.replace(/\.$/, '');
  const TIER_PATS = [
    /top\s+notes?\s+(are|is)\s*/gi, /middle\s+notes?\s+(are|is)\s*/gi,
    /heart\s+notes?\s+(are|is)\s*/gi, /base\s+notes?\s+(are|is)\s*/gi,
    /main\s+notes?\s*:\s*/gi, /notes?\s*:\s*/gi,
    /top\s*:\s*/gi, /middle\s*:\s*/gi, /heart\s*:\s*/gi, /base\s*:\s*/gi, /head\s*:\s*/gi,
    /top\s+notes?\s+/gi, /middle\s+notes?\s+/gi,
    /heart\s+notes?\s+/gi, /base\s+notes?\s+/gi,
  ];
  for (const p of TIER_PATS) s = s.replace(p, '; ');

  // Step 2 – Split on separators including "+" and bullet "•"
  const rawFrags = s.split(/[;,\n+•]+/)
    .map(n => n.trim()
                .replace(/^and\s+/i,'')
                .replace(/^(?:are|is|the)\s+/i,'')
                .replace(/^(?:notes?|main\s+notes?)\s*:\s*/i,'')
                .trim()
                .replace(/[.,]\s*$/,'')
                .replace(/\s*\(description.*\)$/i,'')
                .replace(/\s*\([^)]*\)\s*$/,'')
                .replace(/^\(+/,'')
                .replace(/\)+$/,''))
    .filter(n => n.length > 1 && n.length < 120);

  // Step 3 – Also split anything with "/" if it yields 3+ pieces
  const frags = [];
  for (const f of rawFrags) {
    const slashParts = f.split('/').map(p => p.trim()).filter(p => p.length > 1);
    if (slashParts.length >= 3) frags.push(...slashParts);
    else frags.push(f);
  }

  // Step 4 – Resolve each fragment
  const notes = [];
  for (const frag of frags) {
    const lower = frag.toLowerCase().trim();
    if (!lower || lower.length < 2) continue;

    // a) Exact match in SPLIT_MAP
    if (SPLIT_MAP[lower]) { notes.push(...SPLIT_MAP[lower]); continue; }

    // b) Exact match in CANONICAL_MAP
    if (lower in CANONICAL_MAP) {
      if (CANONICAL_MAP[lower] !== null) notes.push(CANONICAL_MAP[lower]);
      continue;
    }

    // c) Family term → skip
    if (FAMILY_TERMS_SET.has(lower)) continue;

    // d) Try splitting on " and " if both sides are short, plausible notes
    if (lower.includes(' and ')) {
      const parts = lower.split(' and ');
      if (parts.length === 2 && parts[0].trim().length > 1 && parts[1].trim().length > 1 &&
          parts[0].trim().length < 28 && parts[1].trim().length < 28) {
        for (const part of parts) {
          const pt = part.trim();
          const canon = CANONICAL_MAP[pt];
          if (canon !== null) notes.push(canon !== undefined ? canon : pt);
        }
        continue;
      }
    }

    // e) Strip common suffixes and recheck
    let cleaned = lower
      .replace(/\s+absolute$/,'').replace(/\s+essence$/,'').replace(/\s+extract$/,'')
      .replace(/\s+accord$/,'').replace(/\s+tincture$/,'').replace(/\s+oil$/,'')
      .replace(/\s+resin$/,'').replace(/\s+concrete$/,'').replace(/\s+from\s+\w[\w\s]*$/,'')
      .replace(/\s+\(.*?\)$/, '').trim();

    if (cleaned !== lower && cleaned.length > 1) {
      if (cleaned in CANONICAL_MAP) {
        if (CANONICAL_MAP[cleaned] !== null) notes.push(CANONICAL_MAP[cleaned]);
        continue;
      }
      if (FAMILY_TERMS_SET.has(cleaned)) continue;
    }

    // f) If length > 60, probably a garbage blob — skip
    if (lower.length > 60) continue;

    // g) Keep — use cleaned form if suffix-stripped, else original
    notes.push(cleaned !== lower && cleaned.length > 1 ? cleaned : frag.trim());
  }

  // Deduplicate preserving order
  const seen = new Set();
  return notes
    .filter(n => { const k = n.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
    .map(n => n.charAt(0).toUpperCase() + n.slice(1).toLowerCase()
           // preserve known multi-word capitalisations
           .replace(/\biso e super\b/gi, 'ISO E Super')
           .replace(/\bambrox\b/gi,'Ambrox').replace(/\bambrette\b/gi,'Ambrette')
    );
}

// ─── CLEAN CORRUPTED TAGS ─────────────────────────────────────────────────────
const _BAD_TAG_PAT = /\b(top|middle|heart|base|main)\s+notes?\b/i;
function cleanTags(tg) {
  return (tg || []).filter(t =>
    !_BAD_TAG_PAT.test(t) && t.length < 35 && !/ and /i.test(t) &&
    !/\.$/.test(t) && !/^notes?:/i.test(t)
  );
}

function canonicalizeRawTags(tags) {
  return [...new Set((tags || []).map(tag => {
    const raw = tag.toLowerCase().trim();
    // Check original string in CANONICAL_MAP first (handles "orris/iris", "iris/orris", etc.)
    if (raw in CANONICAL_MAP && CANONICAL_MAP[raw]) return CANONICAL_MAP[raw];
    // Replace slashes and extra spaces, then check again
    const lower = raw.replace(/[\/]/g, ' ').replace(/\s+/g, ' ').trim();
    if (lower in CANONICAL_MAP && CANONICAL_MAP[lower]) return CANONICAL_MAP[lower];
    return lower;
  }).filter(Boolean))]; // keep all non-empty tags — multi-word notes like 'birch tar', 'bitter orange' are valid

// ─── TREVOR SCORING ──────────────────────────────────────────────────────────
// Two separate scores computed from tags — no manual ts values needed.
// computeTrevorOnMe  = would Trevor like this *on Kate*?
// computeTrevorSelf  = would Trevor wear this himself?

function computeTrevorOnMe(tags, primary) {
  const all = new Set([...(tags || []), ...(primary || [])]);
  let score = 5;
  // Dense spicy/resinous compositions aren't the clean florals he likes.
  // Gate the big "fresh" bonuses when these dominate (e.g. 34 Blvd St Germain).
  const heavySpice = ['clove','cinnamon','cardamom','nutmeg'].filter(t => all.has(t)).length;
  const isDense = all.has('resin') || all.has('resinous') || all.has('balsamic') || heavySpice >= 2;
  const animalic = all.has('animalic') || all.has('civet') || all.has('castoreum');
  // Rose (any variant except tuberose) + green is his #1 — Corail Oscuro is "rose bourbon"
  const hasRose = [...all].some(t => t.includes('rose') && !t.includes('tuberose'));
  const hasGreen = all.has('green') || all.has('ivy') || all.has('violet leaf') || all.has('shiso') || all.has('aquatic') || all.has('marine');
  if (hasRose && hasGreen && !isDense) score += 2.5;
  else if (hasRose) score += 1;
  // Fresh florals
  if (all.has('orange blossom') || all.has('neroli')) score += 1;
  if (all.has('tuberose') && hasGreen && !isDense) score += 2.5; // Carnal Flower type — clean bold white floral
  if (all.has('jasmine')) score += 0.5;
  if (all.has('lily of the valley')) score += 0.5;
  // Clean skin-musk signature — his grails Fleur de Peau & Musc Outreblanc
  const skinMusk = !animalic && (all.has('skin scent') || all.has('ambrette') ||
      all.has('ambrette seed') || all.has('white musk'));
  if (skinMusk) score += 3;
  else if (!animalic && (all.has('musk') || all.has('musks'))) score += 1;
  if (all.has('iris')) score += 0.5;
  if (all.has('iris') && skinMusk) score += 1.5; // powdery-iris skin musk = peak him
  // Bright mineral / ambergris — Corail Oscuro
  if (all.has('ambergris') || all.has('mineral') || all.has('salty mineral') || all.has('salty')) score += 1.5;
  // Dry woody-aromatic juniper — Orphéon
  if (all.has('juniper')) score += 1.5;
  if (all.has('juniper') && (all.has('cedar') || all.has('vetiver') || all.has('woody') || all.has('woody notes'))) score += 2.5;
  if (all.has('aromatic')) score += 0.5;
  // Citrus/fresh
  if (all.has('citrus') || all.has('bergamot') || all.has('grapefruit') || all.has('lemon') || all.has('yuzu')) score += 0.5;
  if (all.has('pink pepper')) score += 0.5;
  if (hasGreen) score += 0.5;
  if (all.has('ivy') || all.has('violet leaf')) score += 1; // green-leaf notes = very him
  // Strong negatives — animalic, dense, smoke/resin register (NOT powder — he likes clean powdery musks)
  if (animalic) score -= 4;
  if (isDense) score -= 1.5;
  if (all.has('incense') || all.has('oud')) score -= 1.5;
  if (all.has('smoky') || all.has('tobacco')) score -= 1;
  if (all.has('leather')) score -= 0.5;
  return Math.max(0, Math.min(10, Math.round(score * 2) / 2));
}

function computeTrevorSelf(tags, primary) {
  const all = new Set([...(tags || []), ...(primary || [])]);
  let score = 5;
  // Bright/dry citrus first — grapefruit is his personal 10 (Jo Malone Grapefruit)
  if (all.has('grapefruit')) score += 2.5;
  if (all.has('bitter orange') || all.has('petitgrain')) score += 1.5;
  if (all.has('bergamot') || all.has('lemon') || all.has('amalfi lemon') || all.has('italian lemon') ||
      all.has('sicilian lemon') || all.has('lime') || all.has('yuzu')) score += 1;
  if (all.has('orange') || all.has('mandarin') || all.has('mandarin orange') ||
      all.has('tangerine') || all.has('blood orange')) score += 0.5; // sweet citrus OK
  if (all.has('dry citrus') || all.has('hesperidic')) score += 0.5;
  // Fresh/aquatic/green/herbal/aromatic — CK One register (his nostalgic barometer)
  if (all.has('marine') || all.has('aquatic')) score += 1;
  if (all.has('green') || all.has('citrus')) score += 0.5;
  if (all.has('aromatic') || all.has('herbal fresh')) score += 0.5;
  if (all.has('basil') || all.has('sage') || all.has('rosemary') || all.has('thyme') ||
      all.has('mint') || all.has('peppermint') || all.has('eucalyptus') || all.has('angelica root')) score += 0.5;
  if (all.has('juniper')) score += 1; // Orphéon EDT = intoxicating to him
  if (all.has('neroli') || all.has('orange blossom')) score += 0.5;
  // Light dry-woody drydown under fresh citrus — Jo Malone Grapefruit, Sweet Leaf
  const dryWood = all.has('cedar') || all.has('cypress') || all.has('vetiver') ||
      all.has('patchouli') || all.has('sandalwood') || all.has('woody') ||
      all.has('woody notes') || all.has('moss') || all.has('oakmoss');
  if (dryWood) score += 1;
  // NOTE: Bowmakers (violin varnish/rosin) is a sentimental pick — he's a luthier —
  // NOT representative of his nose, so we don't reward resinous woods generally.
  // Light sweet is fine (Orange Marmalade territory) — no penalty
  // Strong negatives — not his register
  if (all.has('powdery') || all.has('aldehydes')) score -= 3;
  if (all.has('animalic') || all.has('civet') || all.has('castoreum')) score -= 4;
  if (all.has('incense') || all.has('oud')) score -= 2;
  if (all.has('smoky') || all.has('tobacco')) score -= 1.5;
  if (all.has('leather')) score -= 1;
  if (all.has('labdanum') || all.has('myrrh')) score -= 0.5;
  return Math.max(0, Math.min(10, Math.round(score * 2) / 2));
}

function normalizePerfume(p) {
  const primary = canonicalizeRawTags(cleanTags(p.pm || [])).filter(t => !PRIMARY_TAG_BLACKLIST.has(t));
  // Allow 'musk' as a primary tag only for genuinely musk-forward perfumes:
  // (a) name contains musk/musc/muschio, OR (b) family field is predominantly musk
  //     (i.e. the only or main family token is a musk variant)
  const nameL = (p.n || '').toLowerCase();
  const famTokens = (p.f || '').toLowerCase().split(/[\s,/\-]+/).filter(Boolean);
  const MUSK_NAME_WORDS = ['musk','musc','muschio','musqué','musky'];
  const nameHasMusk = MUSK_NAME_WORDS.some(w => nameL.includes(w));
  // "predominantly musk" = family has ≤2 non-musk tokens (e.g. "musky" or "musky, floral")
  const NON_MUSK_FAM_WORDS = new Set(['musk','musky','musks','musc','musqué']);
  const nonMuskTokens = famTokens.filter(w => !NON_MUSK_FAM_WORDS.has(w));
  const famIsMoskPrimary = famTokens.some(w => NON_MUSK_FAM_WORDS.has(w)) && nonMuskTokens.length <= 1;
  if ((nameHasMusk || famIsMoskPrimary) && !primary.includes('musk')) primary.push('musk');

  return {
    id: p.i, house: p.h, name: p.n, concentration: p.c || "",
    fullName: p.h + " — " + p.n + (p.c ? " " + p.c : ""),
    family: p.f || "",
    rawNotes: p.no || "",
    notesList: processNotes(p.no || ""),
    notes: processNotes(p.no || "").join("; ") || p.no || "",
    rating: p.r ?? null, tried: p.t ?? false,
    preference: p.pr || "Unrated", status: p.st || "Unrated",
    tags: (() => {
    const t = new Set([...buildTagsFromText(p.no || "", p.f || ""), ...(p.ct || []), ...(p.m === 'Air' ? ['airy'] : [])]);
    // Diary-word unusual detection
    const mn = (p.mn || '').toLowerCase();
    const WEIRD_WORDS = ['weird','strange','odd','bizarre','unexpected','wild','peculiar','metallic','antiseptic','crazy','experimental','pie crust','pie','Play-Doh','playdoh','band-aid','bandaid','hospital'];
    if (WEIRD_WORDS.some(w => new RegExp('\\b' + w + '\\b').test(mn))) t.add('unusual');
    // Lipstick iris: also catch perfumes with "lipstick" in the name
    if ((p.n || '').toLowerCase().includes('lipstick') && t.has('iris')) t.add('lipstick iris');
    return [...t];
  })(),
    primary,
    sigScore: p.ss ?? 5, intScore: p.is ?? 3, balScore: p.bs ?? 5,
    safeScore: computeTrevorOnMe(buildTagsFromText(p.no || "", p.f || ""), primary),
    trevorSelfScore: computeTrevorSelf(buildTagsFromText(p.no || "", p.f || ""), primary),
    mood: p.m || "Classic", myNotes: p.mn || "",
    // Gender: explicit field from data (p.g) → name inference → null (unknown)
    gender: p.g || inferGenderFromName(p.n || "") || null,
    userAdded: p.userAdded || false,
  };
}

// (mirrored to localStorage only as push-staging), so removals persist across devices.
const _wlKey = w => `${(w.house||"").toLowerCase().trim()}|${(w.name||"").toLowerCase().trim()}|${(w.concentration||"").toLowerCase().trim()}`;
function _loadWishlistRemoved() {
  try { const v = JSON.parse(localStorage.getItem("perfume_wishlist_removed") || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}

function activeWishlistSeed() {
  const removed = new Set(_loadWishlistRemoved());

}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function matches(p, { family, character, lanes, safeOnly, wearOnly, excludeAvoid, triedOnly, search, pref, primaryOnly, laneMode, gender, excludeNotes }) {
  if (excludeAvoid && (p.status === "Avoid" || p.status === "Dislike")) return false;
  if (gender && gender.length && !gender.includes(p.gender)) return false;
  if (triedOnly && !p.tried) return false;
  if (pref !== "All" && p.preference !== pref) return false;
  if (safeOnly && p.safeScore < 7) return false;
  if (wearOnly && p.trevorSelfScore < 7) return false;
  // Exclude notes
  if (excludeNotes && excludeNotes.length > 0) {
    const allT = [...new Set([...(p.tags || []), ...(p.primary || [])])];
    if (excludeNotes.some(n => { const nl = n.toLowerCase(); return allT.some(t => t === nl || t.includes(nl)); })) return false;
  }
  // Family filter
  if (family && family !== "All") {
    const f = family.toLowerCase();
    const tagList = primaryOnly ? (p.primary || []) : p.tags;
    if (!tagList.includes(f)) return false;
  }
  // Character filter
  if (character && character !== "All") {
    const c = character.toLowerCase();
    const tagList = primaryOnly ? (p.primary || []) : p.tags;
    if (!tagList.includes(c)) return false;
  }
  // Specific notes
  if (lanes && lanes.length > 0) {
    const tagList = primaryOnly ? (p.primary || []) : [...new Set([...(p.tags || []), ...(p.primary || [])])];
    if (laneMode === "any") {
      if (!lanes.some(l => tagList.includes(l))) return false;
    } else {
      if (!lanes.every(l => tagList.includes(l))) return false;
    }
  }
  if (search) {
    const q = search.toLowerCase();
    if (!p.fullName.toLowerCase().includes(q) && !p.notes.toLowerCase().includes(q) && !p.tags.join(" ").includes(q) && !(p.primary || []).join(" ").includes(q) && !(p.smellsLike || []).join(" ").toLowerCase().includes(q)) return false;
  }
  return true;
}

// ─── GENDER FROM NAME ────────────────────────────────────────────────────────
// Only infer gender from unambiguous words in the perfume name.
// Everything else stays null until the user sets it via the edit panel or imports
// from the spreadsheet.
function inferGenderFromName(name) {
  const n = (name || '').toLowerCase();
  // Masculine keywords — whole-word or phrase match to avoid false positives
  if (/\b(pour homme|pour lui|for men|for him)\b/.test(n) ||
      /\bhomme\b/.test(n) ||
      /\buomo\b/.test(n) ||
      /\bhombre\b/.test(n) ||
      /\bfor men\b/.test(n)) return 'masculine';
  // Feminine keywords
  if (/\b(pour femme|pour elle|for women|for her)\b/.test(n) ||
      /\bfemme\b/.test(n) ||
      /\bdonna\b/.test(n) ||
      /\bmujer\b/.test(n) ||
      /\bfor women\b/.test(n)) return 'feminine';
  return null; // unknown — must be set manually or via spreadsheet import
}

// TF-IDF-style tag weights: rarer tags count more.
let __TAG_IDF = null;
function getTagIdf(perfumes) {
  if (__TAG_IDF) return __TAG_IDF;
  const N = perfumes.length;
  const counts = {};
  perfumes.forEach(p => (p.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  const idf = {};
  for (const t in counts) idf[t] = Math.log(N / counts[t]);
  __TAG_IDF = idf;
  return idf;
}

// Broad family/category labels — excluded from note-level similarity comparison.
// These are too vague to distinguish perfumes (almost every floral has 'floral').
// 'musk' is handled separately via hasMuskAsNote().
const BROAD_FAMILY_TAGS = new Set([
  'floral','woody','citrus','fruity','green','aromatic',
  'aquatic','chypre','oriental','resinous','gourmand','spicy','powdery',
  'aldehydic','white floral','yellow floral','purple floral','dry citrus',
  'herbal fresh','airy','unusual','skin scent','synthetic',
  'musky','fresh','animalic','smoky',
]);

function hasMuskAsNote(p) {
  // Musk is a valid similarity note only when explicitly listed in notes text or name.
  const raw = (p.rawNotes || '').toLowerCase();
  const name = (p.name || '').toLowerCase();
  return ['musk','musc','muschio'].some(w => raw.includes(w) || name.includes(w));
}

function getComparableTags(p) {
  const hasMusk = hasMuskAsNote(p);
  return (p.tags || []).filter(t => {
    if (t === 'musk' || t === 'musks') return hasMusk;
    if (t === 'musky') return false; // always a family descriptor, never a note
    return !BROAD_FAMILY_TAGS.has(t);
  });
}

function similar(ref, safeOnly, perfumes) {
  if (!ref) return [];
  const idf = getTagIdf(perfumes);

  const refTags = getComparableTags(ref);
  const refTagSet = new Set(refTags);
  const refPrimary = new Set(ref.primary || []);
  // IDF-squared norm for Dice denominator
  const refW2 = refTags.reduce((s, t) => s + Math.pow(idf[t] || 0, 2), 0);
  if (refW2 === 0) return [];

  return perfumes
    .filter(p => p.id !== ref.id)
    .filter(p => !safeOnly || p.safeScore >= 7)
    .map(p => {
      const pTags = getComparableTags(p);
      const pPrimary = new Set(p.primary || []);

      let intersectionW2 = 0, primaryBonus = 0, sharedCount = 0;
      const sharedTags = [];

      for (const t of pTags) {
        if (refTagSet.has(t)) {
          const w = idf[t] || 0;
          intersectionW2 += w * w;
          sharedCount += 1;
          sharedTags.push(t);
          // Extra weight when note is primary in BOTH perfumes
          if (refPrimary.has(t) && pPrimary.has(t)) {
            primaryBonus += 0.5 * w * w;
          }
        }
      }

      const pW2 = pTags.reduce((s, t) => s + Math.pow(idf[t] || 0, 2), 0);
      const denom = refW2 + pW2;
      if (denom === 0) return null;

      // IDF-weighted Dice coefficient (0–1), scaled ×10 so threshold 2.5 ≈ Dice 0.25.
      // Dice normalises by both perfumes' note-count weights, so a 6-note perfume
      // can't falsely match an 18-note one just by being a subset of it.
      const sim = (2 * (intersectionW2 + primaryBonus) / denom) * 10;

      // Gender penalty: cross-gender (masc vs fem) pairs score much lower.
      let finalSim = sim;
      if (ref.gender && p.gender &&
          ref.gender !== 'unisex' && p.gender !== 'unisex' &&
          ref.gender !== p.gender) {
        finalSim *= 0.2;
      }

      return { ...p, sim: finalSim, sharedCount, primaryShared: 0, sharedTags };
    })
    .filter(p => p !== null && p.sim >= 2.5 && p.sharedCount >= 1)
    .sort((a, b) => b.sim - a.sim)
    .slice(0, 15);
}

// Wear history analytics
function computeWearStats(wearLog) {
  const stats = new Map();
  const now = new Date();
  for (const entry of wearLog) {
    const pid = entry.perfumeId;
    if (pid == null) continue;
    const cur = stats.get(pid) || { count: 0, lastWorn: null, ratings: [] };
    cur.count += 1;
    const d = new Date(entry.date);
    if (!cur.lastWorn || d > cur.lastWorn) cur.lastWorn = d;
    if (entry.rating != null && entry.rating !== "" && !isNaN(Number(entry.rating))) {
      cur.ratings.push({ date: d, rating: Number(entry.rating) });
    }
    stats.set(pid, cur);
  }
  for (const [, s] of stats) {
    s.daysAgo = Math.floor((now - s.lastWorn) / 86400000);
    s.ratings.sort((a, b) => a.date - b.date);
    s.latestRating = s.ratings.length ? s.ratings[s.ratings.length - 1].rating : null;
    s.firstRating = s.ratings.length ? s.ratings[0].rating : null;
    s.ratingDelta = (s.firstRating != null && s.latestRating != null) ? (s.latestRating - s.firstRating) : null;
  }
  return stats;
}

function enrich(perfumes, stats) {
  return perfumes.map(p => {
    const s = stats.get(p.id);
    const diaryRating = s?.latestRating;
    return {
      ...p,
      // Diary entries override the seed rating so a perfume's card reflects the latest verdict.
      rating: diaryRating != null ? diaryRating : p.rating,
      seedRating: p.rating,
      ratingHistory: s?.ratings || [],
      ratingDelta: s?.ratingDelta ?? null,
      wearCount: s?.count || 0,
      daysAgo: s?.daysAgo,
      isForgottenLove: !!(s && p.preference === "Love" && s.daysAgo > 30),
      isOverworn: !!(s && s.count >= 3 && s.daysAgo < 7),
    };
  });
}

// ─── DIARY → COLLECTION MATCHER ──────────────────────────────────────────────
// New diary entries arrive with just `house` and `perfume` strings. Match them
// to a perfume in the collection so that count + rating updates work.
function _norm(s) {
  return (s || "")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")   // strip accents: é→e, so "Orphéon" === "Orpheon"
    .toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
// Strip trailing "/10" from ratings stored as strings (e.g. "8/10" → 8)
function normalizeWearEntry(entry) {
  if (!entry) return entry;
  const r = entry.rating;
  if (r == null || r === "") return entry;
  const cleaned = String(r).replace(/\/10$/i, "").trim();
  const num = parseFloat(cleaned);
  return isNaN(num) ? { ...entry, rating: null } : { ...entry, rating: num };
}

// Canonical concentration key so EDT / EDP / Extrait etc. can disambiguate
// two otherwise-identical fragrances (same house + name, e.g. Diptyque
// Fleur de Peau EDP vs EDT).
function _concKey(s) {
  const t = _norm(s);
  if (!t) return "";
  if (/\b(edp|eau de parfum)\b/.test(t)) return "edp";
  if (/\b(edt|eau de toilette)\b/.test(t)) return "edt";
  if (/\b(edc|eau de cologne|cologne)\b/.test(t)) return "edc";
  if (/\b(extrait|elixir)\b/.test(t)) return "parfum";
  if (/\bparfum\b/.test(t)) return "parfum";
  if (/\boil\b/.test(t)) return "oil";
  return "";
}
// Remove a TRAILING concentration token from an already-normalized name
// ("fleur de peau edt" → "fleur de peau"). Only strips at the end, so names
// that legitimately contain such a word elsewhere are left intact. "Intense"
// is deliberately excluded (it's part of many fragrance names).
function _stripTrailingConc(normName) {
  return normName.replace(/\s+(eau de parfum|eau de toilette|eau de cologne|extrait de parfum|edp|edt|edc|extrait|parfum|cologne|elixir|oil)$/, "").trim();
}

function attachPerfumeIdToEntry(entry, perfumes) {
  if (!entry) return entry;
  // Trust confidently-matched entries; re-resolve nulls AND old fuzzy matches so the
  // accent fix can correct an "Orpheon EDT" that previously went fuzzy → EDP.
  if (entry.perfumeId != null && entry.fuzzy !== true) return entry;
  if (!entry.perfume) return entry.perfumeId != null ? entry : { ...entry, unmatched: true };
  const targetHouse = _norm(entry.house);
  const fullName = _norm(entry.perfume);
  // Concentration can live in its own field OR be typed into the name
  // (e.g. "Fleur de Peau EDT"). Capture it either way.
  const strippedName = _stripTrailingConc(fullName);
  const hadConcInName = strippedName !== fullName;
  const targetConc = _concKey(entry.concentration) || (hadConcInName ? _concKey(fullName) : "");
  // Among several same-name candidates, prefer the one whose concentration
  // matches; otherwise keep the first (previous behaviour).
  const pick = (cands) => {
    if (cands.length > 1 && targetConc) {
      const cm = cands.find(p => _concKey(p.c || p.concentration) === targetConc);
      if (cm) return cm;
    }
    return cands[0];
  };
  // Try the full typed name first (preserves all existing matches), then the
  // concentration-stripped name as a fallback.
  const tryNames = hadConcInName ? [fullName, strippedName] : [fullName];

  // Strict: exact house + name
  for (const nm of tryNames) {
    const cands = perfumes.filter(p => _norm(p.name) === nm && _norm(p.house) === targetHouse);
    if (cands.length) { const m = pick(cands); return { ...entry, perfumeId: m.id, fuzzy: false, unmatched: false }; }
  }
  // Loose: same name, any house
  for (const nm of tryNames) {
    const cands = perfumes.filter(p => _norm(p.name) === nm);
    if (cands.length) { const m = pick(cands); return { ...entry, perfumeId: m.id, fuzzy: !!targetHouse && _norm(m.house) !== targetHouse, unmatched: false }; }
  }
  // Fuzzy: substring match within same house (concentration-aware)
  if (targetHouse) {
    const cands = perfumes.filter(p => _norm(p.house) === targetHouse && (_norm(p.name).includes(strippedName) || strippedName.includes(_norm(p.name))));
    if (cands.length) { const m = pick(cands); return { ...entry, perfumeId: m.id, fuzzy: true, unmatched: false }; }
  }
  // Last resort: diary entry name is an abbreviation of the seed name (e.g. "Coco" → "Coco Mademoiselle")
  // Only allow start-anchored matches (prevents "Luna" → "Lunamaris").
  const abbr = perfumes.filter(p => {
    const n = _norm(p.name);
    return n.length > 4 && strippedName.length > 3 && n.startsWith(strippedName + ' ');
  });
  if (abbr.length) { const m = pick(abbr); return { ...entry, perfumeId: m.id, fuzzy: true, unmatched: false }; }
  // Re-resolution failed — keep any existing id rather than dropping the match.
  return entry.perfumeId != null ? entry : { ...entry, perfumeId: null, unmatched: true };
}

// ─── CLOUD SYNC ───────────────────────────────────────────────────────────────
// Dispatches between JSONBin.io (preferred — proper REST + readable errors) and
// the legacy Google Sheets webhook. Each dispatcher is independent so old
// Sheets users keep working while new users get a more reliable backend.

const JSONBIN_BASE = "https://api.jsonbin.io/v3/b";

function _localStateBlob() {
  let wearLog = [], wishlist = [], userPerfumes = [], perfumeEdits = {};
  try { wearLog = JSON.parse(localStorage.getItem("perfume_diary") || "[]"); } catch (e) {}
  try { wishlist = JSON.parse(localStorage.getItem("perfume_wishlist") || "[]"); } catch (e) {}
  try { userPerfumes = JSON.parse(localStorage.getItem("perfume_user_perfumes") || "[]"); } catch (e) {}
  try { perfumeEdits = JSON.parse(localStorage.getItem("perfume_edits") || "{}"); } catch (e) {}
  const wishlistRemoved = _loadWishlistRemoved();
  return { wearLog, wishlist, userPerfumes, perfumeEdits, wishlistRemoved, _updatedAt: new Date().toISOString() };
}

// Diary "high-water mark": the largest wearLog count we've ever loaded or pushed.
// Used by the shrink guard so a stale/empty local state can never clobber a full cloud diary.
function _diaryHighWater() { try { return +localStorage.getItem("perfume_diary_highwater") || 0; } catch (e) { return 0; } }
function _raiseDiaryHighWater(n) { try { if (n > _diaryHighWater()) localStorage.setItem("perfume_diary_highwater", String(n)); } catch (e) {} }
function _setDiaryHighWater(n) { try { localStorage.setItem("perfume_diary_highwater", String(n)); } catch (e) {} }

async function jsonbinPush(blob) {
  const binId = localStorage.getItem("cloud_bin_id");
  const apiKey = localStorage.getItem("cloud_api_key");
  if (!binId || !apiKey) return { ok: false, reason: "not-configured" };
  const outgoing = blob || _localStateBlob();
  // Allow intentional shrinks (e.g. a faithful round-trip) to bypass the guard.
  const allowShrink = !!(outgoing && outgoing._allowShrink);
  if (outgoing && "_allowShrink" in outgoing) delete outgoing._allowShrink;
  // SHRINK GUARD: refuse to overwrite a substantially larger cloud diary with a tiny/empty one.
  // This is what makes wipes impossible — stale local state or a structure-less push (the old
  // {_test} write) can no longer clobber the diary. Restores use a separate path and bypass this.
  if (!allowShrink) {
    const hw = _diaryHighWater();
    const n = Array.isArray(outgoing && outgoing.wearLog) ? outgoing.wearLog.length : 0;
    if (hw >= 30 && n < Math.floor(hw * 0.5)) {
      return { ok: false, reason: "shrink-guard", blocked: true, outgoing: n, highwater: hw };
    }
  }
  try {
    const res = await fetch(`${JSONBIN_BASE}/${binId}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": apiKey,
        "X-Bin-Versioning": "false",
      },
      body: JSON.stringify(outgoing),
    });
    if (!res.ok) {
      const txt = await res.text().catch(() => "");
      return { ok: false, status: res.status, body: txt };
    }
    if (Array.isArray(outgoing && outgoing.wearLog)) _raiseDiaryHighWater(outgoing.wearLog.length);
    return { ok: true };
  } catch (e) { return { ok: false, error: String(e) }; }
}

async function jsonbinLoad() {
  const binId = localStorage.getItem("cloud_bin_id");
  const apiKey = localStorage.getItem("cloud_api_key");
  // Authenticated read (private bin)
  if (binId && apiKey) {
    try {
      const res = await fetch(`${JSONBIN_BASE}/${binId}/latest`, {
        headers: { "X-Master-Key": apiKey, "X-Bin-Meta": "false" },
      });
      if (res.ok) {
        const json = await res.json();
        // Handle both raw data shape and wrapped {record: {...}} shape
        const data = (json && json.record && typeof json.record === "object") ? json.record : json;
        // Only return if it looks like app data (has at least one known key)
        if (data && (Array.isArray(data.wearLog) || Array.isArray(data.wishlist) || Array.isArray(data.userPerfumes) || data.perfumeEdits)) {
          if (Array.isArray(data.wearLog)) _raiseDiaryHighWater(data.wearLog.length);
          return data;
        }
      }
    } catch (e) {}
  }
  // Public read fallback — uses CONFIG.publicBinId, no auth header required
  const pubId = (CONFIG.publicBinId || "").trim();
  if (pubId) {
    try {
      const res = await fetch(`${JSONBIN_BASE}/${pubId}/latest`, {
        headers: { "X-Bin-Meta": "false" },
      });
      if (res.ok) {
        const json = await res.json();
        const data = (json && json.record && typeof json.record === "object") ? json.record : json;
        if (data && (Array.isArray(data.wearLog) || Array.isArray(data.wishlist) || Array.isArray(data.userPerfumes) || data.perfumeEdits)) {
          if (Array.isArray(data.wearLog)) _raiseDiaryHighWater(data.wearLog.length);
          return data;
        }
      }
    } catch (e) {}
  }
  return null;
}

// ─── SUPABASE BACKEND (primary) ──────────────────────────────────────────────
// Single-row store: table perfume_state(id text pk, data jsonb). We upsert id='main'.
// No 100kb cap (unlike JSONBin free), proper CORS, syncs across devices.
function supabaseConfigured() {
  return !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);
}
function _sbHeaders() {
  return {
    "apikey": CONFIG.supabaseKey,
    "Authorization": `Bearer ${CONFIG.supabaseKey}`,
    "Content-Type": "application/json",
  };
}
async function supabasePush(blob) {
  const outgoing = blob || _localStateBlob();
  const allowShrink = !!(outgoing && outgoing._allowShrink);
  if (outgoing && "_allowShrink" in outgoing) delete outgoing._allowShrink;
  // Same shrink guard: never overwrite a large cloud diary with a tiny/empty one.
  if (!allowShrink) {
    const hw = _diaryHighWater();
    const n = Array.isArray(outgoing && outgoing.wearLog) ? outgoing.wearLog.length : 0;
    if (hw >= 30 && n < Math.floor(hw * 0.5)) {
      return { ok: false, reason: "shrink-guard", blocked: true, outgoing: n, highwater: hw };
    }
  }
  try {
    const res = await fetch(`${CONFIG.supabaseUrl}/rest/v1/perfume_state?on_conflict=id`, {
      method: "POST",
      headers: { ..._sbHeaders(), "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify([{ id: "main", data: outgoing, updated_at: new Date().toISOString() }]),
    });
    if (!res.ok) { const txt = await res.text().catch(() => ""); return { ok: false, status: res.status, body: txt }; }
    if (Array.isArray(outgoing && outgoing.wearLog)) _raiseDiaryHighWater(outgoing.wearLog.length);
    return { ok: true };
  } catch (e) { return { ok: false, error: String(e) }; }
}
async function supabaseLoad() {
  try {
    const res = await fetch(`${CONFIG.supabaseUrl}/rest/v1/perfume_state?id=eq.main&select=data`, {
      headers: _sbHeaders(),
    });
    if (!res.ok) return null;
    const rows = await res.json();
    if (Array.isArray(rows) && rows.length && rows[0] && rows[0].data) {
      const data = rows[0].data;
      if (data && (Array.isArray(data.wearLog) || Array.isArray(data.wishlist) || Array.isArray(data.userPerfumes) || data.perfumeEdits)) {
        if (Array.isArray(data.wearLog)) _raiseDiaryHighWater(data.wearLog.length);
        return data;
      }
    }
    return null;
  } catch (e) { return null; }
}

// Cloud sync — Supabase primary, JSONBin used once to migrate existing data over.
async function cloudSync(action, data) {
  return supabaseConfigured() ? supabasePush() : jsonbinPush();
}

async function cloudLoad() {
  if (supabaseConfigured()) {
    const d = await supabaseLoad();
    if (d) return d;
    // First load after the switch: Supabase row is empty → pull the legacy JSONBin
    // bin (reads still work under its 100kb cap) and seed Supabase with it.
    const legacy = await jsonbinLoad();
    if (legacy) {

function normalizeTextForMatch(text) {
  // Replace hyphens and underscores with spaces, collapse whitespace, lowercase
  return (text || '').toLowerCase().replace(/[-_]/g, ' ').replace(/\s+/g, ' ');
}

  if (hasF('aldehydic','aldehyde')) { tags.add('powdery'); tags.add('aldehydic'); }
  // Dry / bitter citrus character: grapefruit, petitgrain, bitter orange, and bergamot in dry contexts
  if (tags.has('grapefruit') || tags.has('petitgrain') || tags.has('bitter orange') ||
      (tags.has('bergamot') && has('dry','hesperidic','woody'))) tags.add('dry citrus');
  // ── Additional woody notes ────────────────────────────────────────────────
  if (has('sycamore','maple wood','maplewood','hinoki','sequoia','okoumé')) tags.add('woody');
  // Woody generics and accord variants
  if (has('blond wood','blonde wood','dry wood','white wood','driftwood','stained wood',
           'wet wood','wood notes','woodsy','woody notes','fruity-woody')) tags.add('woody');
  // Woody synthetics — names contain "wood" or are known woody molecules
  if (has('amberwood','coolwood','dreamwood','havanawood','radiant wood')) {
    tags.add('woody'); tags.add('synthetic');
  }
  if (has('akigalawood')) { tags.add('oud'); tags.add('woody'); tags.add('synthetic'); }
  if (has('amyris')) { tags.add('woody'); tags.add('synthetic'); }
  if (has('desert willow')) { tags.add('woody'); tags.add('herbal fresh'); }
  // ── Additional florals ────────────────────────────────────────────────────
  if (has('oleander','jonquil','jonquille','marigold','linden blossom',
           'sweet pea','stephanotis','pittosporum','wisteria','clover','violet leaf')) {
    tags.add('floral');
    if (has('oleander','jonquil','jonquille','marigold','champaca','stephanotis','wisteria','pittosporum','clover')) tags.add('floral');
  }
  // Floral generics, accords, and unusual florals
  if (has('floral notes','flowers','white florals','white flowers','white floral accord',
           'wildflowers','exotic floral accord','bleeding heart flower','bleeding-heart flower',
           'nyctanthes','palmarosa')) tags.add('floral');
  if (has('rosewater','rose water')) { tags.add('floral'); tags.add('gourmand'); }
  if (has('rockrose')) tags.add('labdanum');
  // ── Additional fruity ─────────────────────────────────────────────────────
  if (has('pomegranate','lychee','litchi','apricot','nectarine','melon','watermelon',
           'pineapple','dragee','dragée','persimmon','dragon fruit','passion fruit',
           'grape','rhubarb','papaya')) tags.add('fruity');
  // Fruity generics and unusual fruits
  if (has('fruity notes','dried fruits','candied fruit','fruits')) tags.add('fruity');
  if (has('fruity-woody accord','fruity-woody','fruity woody accord','fruity woody')) { tags.add('fruity'); tags.add('woody'); }
  if (has('jamaican nesberry','sapodilla')) { tags.add('fruity'); tags.add('unusual'); }
  // Rice
  if (has('rice accord','rice cake','rice steam','rice note','jasmine rice')) tags.add('rice');
  // Gourmand generics and unusual gourmands
  if (has('sweet notes','rosewater','rose water')) tags.add('gourmand');
  if (has('cereals','barley','wheat','rye accord')) { tags.add('gourmand'); tags.add('unusual'); }
  if (has('lactonic accord','lactone')) tags.add('cream');
  if (has('maltol')) { tags.add('gourmand'); tags.add('synthetic'); }
  if (has('candied fruit')) tags.add('gourmand');
  // ── Synthetics ────────────────────────────────────────────────────────────
  if (has('ambrox','iso e super','hedione','habanolide','helvetolide','muscenone',
           'cetalox','grisalva','timbersilk','orcanox','mugane','civettone')) tags.add('synthetic');
  // Amber/musk synthetics (amb- prefix = amber/musk character)
  if (has('ambermax')) { tags.add('amber'); tags.add('musk'); tags.add('synthetic'); }
  if (has('ambrettolide')) { tags.add('musk'); tags.add('synthetic'); }
  if (has('amyl salicylate')) { tags.add('powdery'); tags.add('synthetic'); }
  if (has('hexyl acetate')) { tags.add('fruity'); tags.add('synthetic'); }
  if (has('aqual')) { tags.add('aquatic'); tags.add('synthetic'); }
  if (has('maltol')) tags.add('synthetic');
  // ── Citrus generics ───────────────────────────────────────────────────────
  if (has('citrus accord','citrus zest','citrus notes','citruses','citrus (hesperidic)','(citrus')) tags.add('citrus');
  if (hasW('citrus')) tags.add('citrus');
  // ── Herbal/spice generics ─────────────────────────────────────────────────
  if (has('herbal notes','crushed herbs')) tags.add('herbal fresh');
  if (hasW('herbal') || hasW('woods')) tags.add('herbal fresh');
  if (hasW('woods') || has('forest floor')) tags.add('woody');
  if (has('asian spices','spicy notes','dry spicy facets')) tags.add('spicy');
  if (hasW('spices') || hasW('spice')) tags.add('spicy');
  if (has('thistle','wild achillea','yarrow')) { tags.add('herbal fresh'); tags.add('green'); }
  if (has('west indian bay')) tags.add('laurel');
  if (has('calamus')) { tags.add('unusual'); tags.add('herbal fresh'); }
  if (has('alumroot')) { tags.add('unusual'); tags.add('herbal fresh'); }
  if (has('bucchu','buchu')) { tags.add('unusual'); tags.add('green'); }
  if (has('camphorated')) tags.add('unusual');
  if (has('siam benzoin','siam resin','siam')) { tags.add('benzoin'); tags.add('resinous'); }
  // ── Aquatic/ocean accords ─────────────────────────────────────────────────
  if (has('ocean foam','pacific spray','mountain air accord','rain accord',
           'watery notes','snow','sea spray','sea breeze')) tags.add('aquatic');
  if (has('salted accord','salted crystals')) { tags.add('salt'); tags.add('aquatic'); }
  if (has('desert rain accord')) { tags.add('unusual'); tags.add('earthy'); tags.add('aquatic'); }
  // ── Unusual accords & abstract notes ─────────────────────────────────────
  if (has('clean accord','fresh canvas')) tags.add('unusual');
  if (has('denim','linen')) tags.add('unusual');
  if (has('silk accord')) { tags.add('unusual'); tags.add('powdery'); }
  if (has('shaving soap','soap accord')) { tags.add('unusual'); tags.add('powdery'); }
  if (has('solar notes')) tags.add('unusual');
  if (has('wet plaster')) tags.add('unusual');
  if (has('gin accord')) { tags.add('unusual'); tags.add('herbal fresh'); }
  if (has('black olive')) tags.add('unusual');
  if (has('red clay')) { tags.add('unusual'); tags.add('earthy'); }
  if (has('dry leaves')) { tags.add('earthy'); tags.add('green'); }
  if (has('olive oil')) tags.add('unusual');
  if (has('lipstick') && !tags.has('lipstick iris')) { tags.add('unusual'); tags.add('powdery'); }
  if (hasW('skin') || has('sensual skin accord','warm skin accord')) tags.add('skin scent');
  if (has('animal notes','animalic notes')) tags.add('animalic');
  if (has('bubble gum')) { tags.add('bubblegum'); tags.add('unusual'); }
  if (has('rye accord')) tags.add('unusual');
  // ── Earthy generics ───────────────────────────────────────────────────────
  if (has('desert rain accord','red clay')) tags.add('earthy');
  return [...tags];
}

function scoreNewPerfume({ notes, family, tags, myNotes, rating }) {
  const text = `${notes || ''} ${family || ''} ${(tags || []).join(' ')}`.toLowerCase();
  const mn = (myNotes || '').toLowerCase();
  const has = (...w) => w.some(x => text.includes(x));
  const hasMn = (...w) => w.some(x => mn.includes(x));

  let sig = 5;
  if (has('iris', 'orris')) sig += 2;
  if (has('violet')) sig += 2;
  if ((tags || []).includes('lipstick iris')) sig += 1;
  if (has('powder', 'powdery')) sig += 1;
  if (has('musk', 'ambrette', 'ambrox')) sig += 1;
  if (has(' tea', 'lapsang')) sig += 1;
  if (has('grapefruit', 'pomelo')) sig += 1;
  if (has('peach', 'osmanthus')) sig += 1;
  if (has('herbal', 'mint')) sig += 1;
  if (has('resin', 'incense')) sig += 1;
  if (has('marshmallow', 'caramel', 'gourmand', 'praline')) sig -= 2;
  if (hasMn('hate', 'scrub', 'disgusting', 'headache', 'nuclear', 'ick')) sig -= 3;
  if (rating != null && rating <= 3) sig -= 2;
  sig = Math.max(0, Math.min(10, sig));

  let intr = 3;
  if (has('incense', 'frankincense', 'olibanum')) intr += 2;
  if (has('smoke', 'smoky', 'tobacco')) intr += 2;
  if (has('suede', 'leather')) intr += 1;
  if (has('mineral', 'ozonic')) intr += 1;
  if (has('vetiver', 'carrot seed', 'cypriol')) intr += 1;
  if (has(' tea') && has('resin', 'incense', 'herbal')) intr += 1;
  if (has('iris') && has('musk', 'ambrox')) intr += 1;
  intr = Math.max(0, Math.min(10, intr));

  let trev = 5;
  if (has('grapefruit')) trev += 3;
  if (has('bergamot', 'pomelo', 'neroli', 'mandarin')) trev += 2;
  if (has('lemon', 'lime')) trev += 1;
  if (has('vetiver')) trev += 1;
  if (has('herbal', 'mint', 'aromatic')) trev += 1;
  if (has(' tea', 'lapsang')) trev += 1;
  if (has('marshmallow', 'caramel', 'gourmand', 'vanilla', 'sweet')) trev -= 2;
  if (has('powder', 'powdery')) trev -= 1;
  if (has('oud', 'agarwood')) trev -= 2;
  trev = Math.max(0, Math.min(10, trev));

  const bal = sig + Math.round(intr / 2);

  const airHits = [
    has(' tea', 'lapsang'),
    has('grapefruit', 'pomelo', 'bergamot', 'citrus'),
    has('peach', 'osmanthus'),
    has('herbal', 'mint'),
    has('musk') && !has('amber', 'incense'),
  ].filter(Boolean).length;
  const resHits = [
    has('resin', 'incense', 'frankincense', 'myrrh'),
    has('amber', 'labdanum'),
    has('vanilla') && !has('marshmallow'),
    has('smoke', 'smoky'),
  ].filter(Boolean).length;
  let mood;
  if (airHits >= 2 && resHits <= 1) mood = 'Air';
  else if (resHits >= 2 && airHits <= 1) mood = 'Resin';
  else if (airHits >= 1 && resHits >= 1) mood = 'Bridge';
  else mood = 'Classic';

  return { sigScore: sig, intScore: intr, balScore: bal, safeScore: trev, mood };
}

function prefFromRating(r) {
  if (r == null) return 'Unrated';
  if (r >= 9) return 'Love';
  if (r >= 8) return 'Like';
  if (r >= 6) return 'Neutral';
  return 'Dislike';
}

function NoteFilter({ selected, onChange, primaryOnly, onPrimaryToggle, laneMode, onLaneModeChange }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");

  const toggle = (note) => {
    const lower = note.toLowerCase();
    if (selected.includes(lower)) onChange(selected.filter(s => s !== lower));
    else onChange([...selected, lower]);
  };

  const filterFn = (lane) => {
    if (!search) return true;
    return lane.toLowerCase().includes(search.toLowerCase());
  };

  const visibleGroups = NOTE_GROUPS.map(g => ({
    ...g,
    lanes: g.notes.filter(filterFn),
  })).filter(g => g.lanes.length > 0);

  return <div className="note-filter">
    <div className="note-filter-head" onClick={() => setOpen(o => !o)}>
      <span className="mini-lbl">Notes / Family</span>
      <span className="note-filter-summary">
        {selected.length === 0 ? "All" : selected.length === 1 ? selected[0] : `${selected.length} selected`}
        <span className="note-filter-chevron">{open ? "▴" : "▾"}</span>
      </span>
    </div>

    {selected.length > 0 && (
      <div className="selected-chips-row">
        {selected.map(s => (
          <button key={s} className="selected-chip" onClick={() => toggle(s)} title="Remove">
            {s} <span className="chip-x">×</span>
          </button>
        ))}
        {selected.length > 1 && (
          <button className="lane-mode-toggle" onClick={() => onLaneModeChange(laneMode === "all" ? "any" : "all")}>
            {laneMode === "all" ? "match ALL" : "match ANY"}
          </button>
        )}
        <button className="clear-all" onClick={() => onChange([])}>clear</button>
      </div>
    )}

    {open && (
      <div className="note-picker">
        <input
          className="note-picker-search"
          placeholder="Search notes…"
          value={search}
          onChange={e => setSearch(e.target.value)}
        />
        <div className="note-picker-options">
          <label className="note-picker-toggle">
            <input type="checkbox" checked={primaryOnly} onChange={e => onPrimaryToggle(e.target.checked)} />
            <span>Key notes only</span>
          </label>
        </div>
        {visibleGroups.map(g => (
          <div key={g.label} className="note-group">
            <div className="note-group-label">{g.label}</div>
            <div className="note-group-chips">
              {g.lanes.map(l => {
                const key = l.toLowerCase();
                const isActive = selected.includes(key);
                const color = TAG_COLOR[key] || "#999";
                return (
                  <button
                    key={l}
                    className={`pick-chip ${isActive ? "active" : ""}`}

                      background: color + "25",

                    } : {}}

            </div>
          </div>
        ))}

      </div>
    )}
  </div>;
}

function fmtAge(daysAgo) {
  if (daysAgo == null) return null;
  if (daysAgo === 0) return "today";
  if (daysAgo === 1) return "yesterday";
  if (daysAgo < 7) return daysAgo + "d ago";
  if (daysAgo < 30) return Math.round(daysAgo / 7) + "w ago";
  if (daysAgo < 365) return Math.round(daysAgo / 30) + "mo ago";
  return Math.round(daysAgo / 365) + "y ago";
}

      {p.smellsLike && p.smellsLike.length > 0 && (() => {
        const resolvedLinks = (p.smellsLike || []).map(name => {
          const nl = name.trim().toLowerCase();
          const wordEnd = (str, sub) => {
            const i = str.indexOf(sub);
            if (i === -1) return false;
            const after = str[i + sub.length];
            return after === undefined || /[\s\-\'\(]/.test(after);
          };
          const found = (perfumes && perfumes.length) ? (
            perfumes.find(q => q.fullName.toLowerCase() === nl) ||
            perfumes.find(q => q.name.toLowerCase() === nl) ||
            perfumes.find(q => q.fullName.toLowerCase().endsWith(nl)) ||
            perfumes.find(q => wordEnd(q.fullName.toLowerCase(), nl)) ||
            perfumes.find(q => wordEnd(q.name.toLowerCase(), nl))
          ) : null;
          return { name, found };
        });
        return <div style={{marginBottom:12}}>
          <div className="sec-lbl" style={{marginBottom:6}}>Smells like</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {resolvedLinks.map(({ name, found }) => found
              ? <button key={name} onClick={() => onNavigate(found)} style={{background:"none",border:"1px solid var(--border-soft)",borderRadius:999,padding:"3px 12px",fontSize:12,color:"var(--gold)",cursor:"pointer",fontFamily:"inherit",textDecoration:"none"}}>{found.house} {found.name}</button>
              : <span key={name} style={{padding:"3px 12px",borderRadius:999,background:"var(--bg-soft)",fontSize:12,color:"var(--fg-mute)",border:"1px solid var(--border-soft)"}}>{name}</span>
            )}
          </div>
        </div>;
      })()}
      {p.myNotes && !editMode && <><div className="sec-lbl">My Experience</div><div className="my-notes">{p.myNotes}</div></>}

      {/* ── Edit panel ── */}
      {editMode ? (
        <div className="modal-edit-panel">
          <div className="modal-edit-title">Edit</div>
          <div className="form-grid" style={{marginBottom: 12}}>
            <label><span className="mini-lbl">My Rating (x/10)</span>
              <input type="number" min="0" max="10" step="0.5" value={editForm.rating} onChange={e => ef("rating", e.target.value)} placeholder="leave blank if unrated" />
            </label>
            <label><span className="mini-lbl">Status</span>
              <select value={editForm.status} onChange={e => ef("status", e.target.value)} style={{border:"1px solid #ddd",background:"#fff",padding:"10px 12px",fontSize:14,outline:"none",minHeight:44,width:"100%"}}>
                {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </label>
            <label><span className="mini-lbl">Gender</span>
              <select value={editForm.gender || ""} onChange={e => ef("gender", e.target.value)} style={{border:"1px solid #ddd",background:"#fff",padding:"10px 12px",fontSize:14,outline:"none",minHeight:44,width:"100%"}}>
                <option value="">Unknown</option>
                <option value="masculine">Masculine</option>
                <option value="feminine">Feminine</option>
                <option value="unisex">Unisex</option>
              </select>
            </label>
            <label className="full-span"><span className="mini-lbl">Notes (raw, comma or semicolon separated)</span>
              <textarea value={editForm.rawNotes} onChange={e => ef("rawNotes", e.target.value)} placeholder="e.g. rose, bergamot, sandalwood, musk" style={{minHeight:60}} />
            </label>
            <label><span className="mini-lbl">Family / accord</span>
              <input type="text" value={editForm.family} onChange={e => ef("family", e.target.value)} placeholder="e.g. floral woody" />
            </label>
            <label><span className="mini-lbl">Chart category {editForm.categoryOverride ? "(override)" : "(auto)"}</span>
              <select value={editForm.categoryOverride || ""} onChange={e => ef("categoryOverride", e.target.value)} style={{border:"1px solid #ddd",background:"#fff",padding:"10px 12px",fontSize:14,outline:"none",minHeight:44,width:"100%"}}>
                <option value="">Auto (from notes)</option>
                {CATEGORY_MAP.map(c => <option key={c.label} value={c.label}>{c.label}</option>)}
                <option value="Other">Other</option>
              </select>
            </label>
            <label><span className="mini-lbl">Primary notes (comma separated)</span>
              <input type="text" value={editForm.primaryTags} onChange={e => ef("primaryTags", e.target.value)} placeholder="e.g. rose, sandalwood" />
            </label>
            <div className="full-span"><span className="mini-lbl">Curated tags</span>
              <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:6}}>
                {CURATED_TAGS.map(t => (
                  <label key={t} style={{display:"flex",alignItems:"center",gap:5,fontSize:13,cursor:"pointer",border:"1px solid #ddd",borderRadius:8,padding:"4px 10px"}}>
                    <input type="checkbox" checked={(editForm.curated || []).includes(t)}
                      onChange={e => ef("curated", e.target.checked ? [...(editForm.curated || []), t] : (editForm.curated || []).filter(x => x !== t))} />
                    {t}
                  </label>
                ))}
              </div>
            </div>
            <label className="full-span"><span className="mini-lbl">My Experience</span>
              <textarea value={editForm.myNotes} onChange={e => ef("myNotes", e.target.value)} placeholder="How it wears, your impressions, memories…" style={{minHeight:80}} />
            </label>
            <label className="full-span"><span className="mini-lbl">Smells like / reminds me of (comma-separated perfume names)</span>
              <textarea value={editForm.smellsLike || ""} onChange={e => ef("smellsLike", e.target.value)} placeholder="e.g. Le Labo Santal 33, Byredo Gypsy Water" style={{minHeight:50}} />
            </label>
          </div>
          <div className="form-actions">
            <button className="btn-primary" onClick={saveEdit}>Save</button>
            <button className="btn-ghost" onClick={() => setEditMode(false)}>Cancel</button>
          </div>
        </div>
      ) : (
        <div style={{marginTop: 16, textAlign: "right"}}>
          <button className="entry-action-btn" onClick={openEdit}>Edit this entry</button>
        </div>
      )}
    </div>
  </div>;
}
