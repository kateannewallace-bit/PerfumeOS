function CollectionView({ onSelect, wearStats, perfumes }) {
  const [search, setSearch] = useState("");
  const [pref, setPref] = useState("All");
  const [family, setFamily] = useState("All");
  const [character, setCharacter] = useState("All");
  const [lanes, setLanes] = useState([]);
  const [laneMode, setLaneMode] = useState("all");
  const [triedOnly, setTriedOnly] = useState(false);
  const [trevorOnly, setTrevorOnly] = useState(false);
  const [trevorWearOnly, setTrevorWearOnly] = useState(false);
  const [primaryOnly, setPrimaryOnly] = useState(false);
  const [sort, setSort] = useState("balScore");
  const [sortDir, setSortDir] = useState("desc"); // desc = best/high first, asc = worst/low first
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [genders, setGenders] = useState([]); // [] = all; multi-select
  const [excludeNotes, setExcludeNotes] = useState([]);
  const [excludeInput, setExcludeInput] = useState("");

  const enriched = useMemo(() => enrich(perfumes, wearStats), [wearStats, perfumes]);

  const res = useMemo(() => {
    return enriched
      .filter(p => matches(p, { family, character, lanes, safeOnly: trevorOnly, wearOnly: trevorWearOnly, excludeAvoid: false, triedOnly, search, pref, primaryOnly, laneMode, gender: genders, excludeNotes }))
      .sort((a,b) => {
        const dir = sortDir === "asc" ? -1 : 1;
        if (sort === "house") return a.house.localeCompare(b.house) * dir;
        if (sort === "name") return a.name.localeCompare(b.name) * dir;
        if (sort === "rating") return ((b.rating||0)-(a.rating||0)) * dir;
        return (b[sort]-a[sort]) * dir;
      });
  }, [enriched, search, pref, family, character, lanes, triedOnly, trevorOnly, trevorWearOnly, sort, sortDir, primaryOnly, laneMode, genders, excludeNotes]);

  return <div>
    <h1 className="page-title">The Collection</h1>
    <p className="page-sub">{perfumes.length} fragrances · {perfumes.filter(p=>p.tried).length} tried · {perfumes.filter(p=>p.preference==="Love").length} loved</p>

    <input className="search-input" placeholder="Search name, house, or note…" value={search} onChange={e => setSearch(e.target.value)} />

    <button className="filter-toggle" onClick={() => setFiltersOpen(f => !f)}>
      {filtersOpen ? "Hide" : "Show"} Filters
      <span className="filter-summary">
        {genders.length > 0 && genders.map(g => g==="feminine"?"Fem":g==="masculine"?"Masc":"Uni").join("/")} {pref !== "All" && pref} {family !== "All" && family} {character !== "All" && character} {lanes.length > 0 && (lanes.length === 1 ? lanes[0] : `${lanes.length} notes`)} {excludeNotes.length > 0 && `−${excludeNotes.length} excluded`} {triedOnly && "Tried"} {trevorOnly && `· ${CONFIG.partnerName || "Partner"} on you`} {trevorWearOnly && `· ${CONFIG.partnerName || "Partner"} wears`} {primaryOnly && "· primary"}
      </span>
    </button>

    <div className={`filter-panel ${filtersOpen ? "open" : ""}`}>
      <label><span className="mini-lbl">Gender</span><div style={{display:"flex",gap:4,width:"100%"}}>{[["feminine","Fem"],["masculine","Masc"],["unisex","Uni"]].map(([g,lbl]) => <button key={g} type="button" className={`toggle ${genders.includes(g) ? "active" : ""}`} style={{flex:1,minWidth:0,padding:"8px 4px",letterSpacing:"0.03em"}} onClick={() => setGenders(gs => gs.includes(g) ? gs.filter(x => x!==g) : [...gs, g])}>{lbl}</button>)}</div></label>
      <label><span className="mini-lbl">Preference</span><select value={pref} onChange={e => setPref(e.target.value)}>{PREFS.map(p => <option key={p}>{p}</option>)}</select></label>
      <button onClick={() => { setGenders([]); setPref("All"); setFamily("All"); setCharacter("All"); setLanes([]); setExcludeNotes([]); setExcludeInput(""); setPrimaryOnly(false); setTriedOnly(false); }} style={{gridColumn:"1/-1",background:"none",border:"1px solid #ddd",borderRadius:8,padding:"8px",fontSize:12,color:"#999",cursor:"pointer",marginTop:4}}>Clear all filters</button>
      <label><span className="mini-lbl">Family</span><select value={family} onChange={e => setFamily(e.target.value)}>{FAMILY_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}</select></label>
      <label><span className="mini-lbl">Character</span><select value={character} onChange={e => setCharacter(e.target.value)}>{CHARACTER_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}</select></label>
      <div className="lane-filter-wrap">
        <NoteFilter
          selected={lanes}
          onChange={setLanes}
          primaryOnly={primaryOnly}
          onPrimaryToggle={setPrimaryOnly}
          laneMode={laneMode}
          onLaneModeChange={setLaneMode}
        />
        {/* Exclude notes */}
        <div style={{marginTop:10}}>
          <span className="mini-lbl" style={{display:"block",marginBottom:4}}>Exclude notes</span>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
            {excludeNotes.map(n => (
              <span key={n} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px",borderRadius:999,background:"#f3e0e0",border:"1px solid #d9a0a0",fontSize:12,color:"#9b4040"}}>
                {n}
                <button onClick={() => setExcludeNotes(prev => prev.filter(x => x !== n))} style={{background:"none",border:"none",cursor:"pointer",padding:0,color:"#9b4040",fontWeight:600,lineHeight:1}}>×</button>
              </span>
            ))}
            <input
              className="note-picker-search"
              style={{flex:1,minWidth:120,fontSize:12}}
              placeholder="Type a note to exclude, press Enter…"
              value={excludeInput}
              onChange={e => setExcludeInput(e.target.value)}
              onKeyDown={e => {
                if ((e.key === "Enter" || e.key === ",") && excludeInput.trim()) {
                  e.preventDefault();
                  const n = excludeInput.trim().toLowerCase().replace(/,$/, "");
                  if (n && !excludeNotes.includes(n)) setExcludeNotes(prev => [...prev, n]);
                  setExcludeInput("");
                }
              }}
            />
          </div>
        </div>
      </div>
      <label><span className="mini-lbl">Sort</span><select value={sort} onChange={e => setSort(e.target.value)}>
        <option value="balScore">By Appeal</option>
        <option value="sigScore">By Match</option>
        {CONFIG.partnerName && <option value="safeScore">By {CONFIG.partnerName} (on you)</option>}
        {CONFIG.partnerName && <option value="trevorSelfScore">By {CONFIG.partnerName} (wears)</option>}
        <option value="rating">By Rating</option>
        <option value="house">By House</option>
        <option value="name">By Name</option>
      </select><button type="button" className={`toggle ${sortDir === "asc" ? "active" : ""}`} style={{marginTop:4,padding:"6px 4px",fontSize:11}} onClick={() => setSortDir(d => d === "desc" ? "asc" : "desc")}>{sortDir === "desc" ? "↓ Best / High first" : "↑ Worst / Low first"}</button></label>
      <button className={`toggle ${triedOnly ? "active" : ""}`} onClick={() => setTriedOnly(t => !t)}>Tried Only</button>
      {CONFIG.partnerName && <button className={`toggle ${trevorOnly ? "active" : ""}`} onClick={() => setTrevorOnly(t => !t)}>{CONFIG.partnerName} on you ✓</button>}
      {CONFIG.partnerName && <button className={`toggle ${trevorWearOnly ? "active" : ""}`} onClick={() => setTrevorWearOnly(t => !t)}>{CONFIG.partnerName} wears ✓</button>}
    </div>

    <div className="result-count">{res.length} fragrance{res.length !== 1 ? "s" : ""}</div>
    <div className="grid">{res.map(p => <Card key={p.id} p={p} onClick={onSelect} />)}</div>
  </div>;
}

function simLabel(score) {
  if (score >= 14) return "Very close";
  if (score >= 10) return "Close";
  if (score >= 7)  return "Related";
  return "Loosely related";
}

function SimilarView({ onSelect, perfumes }) {
  const [refId, setRefId] = useState(null);
  const [query, setQuery] = useState("");
  const [trevOnly, setTrevOnly] = useState(false);
  const [genderFilter, setGenderFilter] = useState("All");
  const [mode, setMode] = useState("perfume"); // "perfume" | "note"
  const [noteQuery, setNoteQuery] = useState("");

  const ref = refId !== null ? perfumes.find(p => p.id === refId) : null;
  const results = useMemo(() => similar(ref, trevOnly, perfumes), [ref, trevOnly, perfumes]);

  // Note-search mode: collect all unique tags, filter by query, show perfumes
  const allTags = useMemo(() => {
    const tagSet = new Set();
    perfumes.forEach(p => (p.tags || []).forEach(t => tagSet.add(t)));
    return [...tagSet].sort();
  }, [perfumes]);

  const matchedTags = useMemo(() => {
    const q = noteQuery.toLowerCase().trim();
    return q ? allTags.filter(t => t.includes(q)) : [];
  }, [noteQuery, allTags]);

  const selectedTag = matchedTags.length === 1 ? matchedTags[0] : allTags.find(t => t === noteQuery.toLowerCase().trim()) || null;

  const noteResults = useMemo(() => {
    if (!selectedTag) return [];
    const primary = perfumes.filter(p => (p.primary || []).includes(selectedTag));
    const secondary = perfumes.filter(p => !primary.includes(p) && (p.tags || []).includes(selectedTag));
    return [...primary.map(p => ({...p, _isPrimary: true})), ...secondary.map(p => ({...p, _isPrimary: false}))];
  }, [selectedTag, perfumes]);

  // Perfume-mode selector: filter by query + gender
  const choices = useMemo(() => {
    const q = query.toLowerCase().trim();
    return perfumes
      .filter(p => !q || p.fullName.toLowerCase().includes(q))
      .filter(p => genderFilter === "All" || p.gender === genderFilter)
      .sort((a,b) => a.fullName.localeCompare(b.fullName));
  }, [perfumes, query, genderFilter]);

  return <div>
    <h2 className="section-title">Find Similar</h2>

    {/* Mode toggle */}
    <div className="inline-row" style={{marginBottom:12}}>
      <button className={`tab ${mode==="perfume"?"active":""}`} style={{flex:1}} onClick={()=>setMode("perfume")}>By Perfume</button>
      <button className={`tab ${mode==="note"?"active":""}`} style={{flex:1}} onClick={()=>setMode("note")}>By Note</button>
    </div>

    {mode === "note" ? <>
      <input type="search" placeholder="Type a note (e.g. iris, oud, vetiver)…" value={noteQuery} onChange={e=>setNoteQuery(e.target.value)} style={{width:"100%",marginBottom:8,boxSizing:"border-box"}} />
      {noteQuery && matchedTags.length > 0 && !selectedTag && <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
        {matchedTags.slice(0,12).map(t => <button key={t} onClick={()=>setNoteQuery(t)} style={{padding:"4px 10px",fontSize:12,border:"1px solid #ddd",borderRadius:8,background:"#faf9f7",cursor:"pointer"}}>{t}</button>)}
      </div>}
      {selectedTag && <div className="sec-lbl" style={{marginBottom:10}}>Perfumes featuring <strong>{selectedTag}</strong> — {noteResults.filter(p=>p._isPrimary).length} primary, {noteResults.filter(p=>!p._isPrimary).length} secondary</div>}
      {selectedTag && noteResults.length === 0 && <p className="empty">No perfumes found with that note.</p>}
      <div className="grid">
        {noteResults.map(p => <Card key={p.id} p={p} onClick={()=>onSelect(p)} annotation={p._isPrimary ? <span style={{fontSize:11,color:"#c8a97e",fontWeight:600}}>● Primary note</span> : <span style={{fontSize:11,color:"#aaa"}}>○ Also present</span>} />)}
      </div>
    </> : <>
    <div className="inline-row" style={{marginBottom:8}}>
      <input type="search" placeholder="Filter perfumes…" value={query} onChange={e=>setQuery(e.target.value)} style={{flex:1}} />
      <button className={`toggle ${trevOnly?'active':''}`} onClick={()=>setTrevOnly(t=>!t)}>{(CONFIG.partnerName||'Partner')+' ✓'}</button>
    </div>
    <div className="inline-row" style={{marginBottom:10,gap:4}}>
      {["All","feminine","masculine","unisex"].map(g => <button key={g} className={`tab ${genderFilter===g?"active":""}`} style={{flex:1,padding:"6px 4px",fontSize:11}} onClick={()=>setGenderFilter(g)}>{g==="All"?"All genders":g==="feminine"?"Feminine":g==="masculine"?"Masculine":"Unisex"}</button>)}
    </div>
    <select value={refId??''} onChange={e=>setRefId(e.target.value===''?null:parseInt(e.target.value))} style={{width:'100%',marginBottom:14,padding:'10px 14px',fontSize:14,fontFamily:'inherit',border:'1px solid #ddd',background:'#fff',minHeight:44}}>
      <option value="">— Pick a reference perfume ({choices.length}) —</option>
      {choices.map(p => <option key={p.id} value={p.id}>{p.fullName}</option>)}
    </select>

    {ref && (() => {
      const refPrims = new Set(ref.primary || []);
      return <div style={{background:"#faf9f7",border:"1px solid #e8e2da",borderRadius:12,padding:"14px 16px",marginBottom:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div>
            <div className="card-house" style={{marginBottom:2}}>{ref.house}</div>
            <div style={{fontSize:16,fontWeight:600,color:"#2d2926"}}>{ref.name}{ref.concentration ? " — " + ref.concentration : ""}</div>
            <div style={{fontSize:12,color:"#999",marginTop:3}}>{ref.family}</div>
          </div>
          <div style={{textAlign:"right",display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
            {ref.rating != null && <span className="card-rating" style={{color:ref.rating>=9?"#c8a97e":ref.rating>=8?"#8aaa80":"#999"}}>{ref.rating}/10</span>}
            {ref.gender && <span style={{fontSize:11,fontWeight:600,letterSpacing:"0.05em",padding:"3px 8px",borderRadius:10,textTransform:"uppercase",background:ref.gender==="feminine"?"#f3e6f0":ref.gender==="masculine"?"#e6edf8":"#eef3e6",color:ref.gender==="feminine"?"#9b5f8a":ref.gender==="masculine"?"#4a6fa5":"#5a7a4a"}}>{ref.gender}</span>}
          </div>
        </div>
        <div className="tag-row" style={{marginBottom:0}}>
          {ref.tags.map(t => <Tag key={t} tag={t} primary={refPrims.has(t)} />)}
        </div>
      </div>;
    })()}

    {ref && results.length === 0 && <p className="empty">No strong matches. Try a different reference.</p>}
    {ref && results.length > 0 && <div className="sec-lbl" style={{marginBottom:10}}>Most similar to {ref.fullName}</div>}
    <div className="grid">
      {results.map(p => {
        const refPrims = new Set(ref ? (ref.primary || []) : []);
        const matchedPrims = (p.sharedTags || []).filter(t => refPrims.has(t));
        const label = simLabel(p.sim);
        const annotation = <div>
          <div style={{fontSize:11,color:"#aaa",marginBottom:5}}><span style={{color:p.sim>=14?"#c8a97e":p.sim>=10?"#8aaa80":"#aaa",fontWeight:p.sim>=10?600:400}}>{label}</span> · {p.sharedCount} shared{matchedPrims.length > 0 ? ` · ${matchedPrims.length} primary` : ""}</div>
          {p.sharedTags && p.sharedTags.length > 0 && <div className="tag-row" style={{marginBottom:0,flexWrap:"wrap"}}>
            {p.sharedTags.map(t => <span key={t} style={{fontSize:10,padding:"2px 7px",borderRadius:8,background:refPrims.has(t)?"#c8a97e22":"#f0ece6",color:refPrims.has(t)?"#8b6f3e":"#7a6a5a",border:refPrims.has(t)?"1px solid #c8a97e66":"1px solid transparent",fontWeight:refPrims.has(t)?600:400}}>{t}</span>)}
          </div>}
        </div>;
        return <Card key={p.id} p={p} onClick={()=>onSelect(p)} annotation={annotation} />;
      })}
    </div>
    </>}
  </div>;
}

// CompareView component — paste this before TaxonomyView

function CompareView({ perfumes }) {
  const [idA, setIdA] = useState(null);
  const [idB, setIdB] = useState(null);
  const [queryA, setQueryA] = useState("");
  const [queryB, setQueryB] = useState("");

  const a = idA !== null ? perfumes.find(p => p.id === idA) : null;
  const b = idB !== null ? perfumes.find(p => p.id === idB) : null;

  const filtered = (q) => {
    const lower = q.toLowerCase().trim();
    return perfumes
      .filter(p => !lower || p.fullName.toLowerCase().includes(lower))
      .sort((x, y) => x.fullName.localeCompare(y.fullName));
  };

  // Compute shared/unique note sets
  const { sharedTags, onlyA, onlyB, sharedPrimary } = useMemo(() => {
    if (!a || !b) return { sharedTags: new Set(), onlyA: [], onlyB: [], sharedPrimary: new Set() };
    const tagsA = new Set(a.tags || []);
    const tagsB = new Set(b.tags || []);
    const primA = new Set(a.primary || []);
    const primB = new Set(b.primary || []);
    const shared = new Set([...tagsA].filter(t => tagsB.has(t)));
    const sharedPrim = new Set([...shared].filter(t => primA.has(t) && primB.has(t)));
    const uniqA = [...tagsA].filter(t => !tagsB.has(t));
    const uniqB = [...tagsB].filter(t => !tagsA.has(t));
    return { sharedTags: shared, onlyA: uniqA, onlyB: uniqB, sharedPrimary: sharedPrim };
  }, [a, b]);

  const tagStyle = (tag, pref) => {
    const isPrim = (pref?.primary || []).includes(tag);
    const isShared = sharedTags.has(tag);
    const isBothPrim = sharedPrimary.has(tag);
    if (isBothPrim) return { background: "#c8a97e", color: "#fff", border: "none", fontWeight: 700 };
    if (isShared && isPrim) return { background: "#c8a97e44", color: "#8b6f3e", border: "1px solid #c8a97e99", fontWeight: 600 };
    if (isShared) return { background: "#e8f0e8", color: "#4a6a4a", border: "1px solid #aaccaa" };
    if (isPrim) return { background: "#f5f0e8", color: "#8b6f3e", border: "1px solid #d4bc8a", fontWeight: 600 };
    return { background: "#f0ece6", color: "#888", border: "1px solid transparent" };
  };

  const genderStyle = (g) => ({
    fontSize: 11, fontWeight: 600, letterSpacing: "0.05em", padding: "2px 8px",
    borderRadius: 10, textTransform: "uppercase",
    background: g === "feminine" ? "#f3e6f0" : g === "masculine" ? "#e6edf8" : "#eef3e6",
    color: g === "feminine" ? "#9b5f8a" : g === "masculine" ? "#4a6fa5" : "#5a7a4a"
  });

  const scoreDiff = (a && b) ? {
    sig: (a.sigScore || 5) - (b.sigScore || 5),
    int: (a.intScore || 3) - (b.intScore || 3),
    bal: (a.balScore || 5) - (b.balScore || 5),
  } : null;

  const ScoreBar = ({ label, valA, valB, max = 10 }) => {
    const diff = Math.abs(valA - valB);
    return <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#999", marginBottom: 3 }}>
        <span style={{ fontWeight: 600, color: "#555" }}>{valA}</span>
        <span style={{ color: "#bbb" }}>{label}</span>
        <span style={{ fontWeight: 600, color: "#555" }}>{valB}</span>
      </div>
      <div style={{ display: "flex", height: 6, borderRadius: 3, overflow: "hidden", background: "#f0ece6" }}>
        <div style={{ width: `${(valA / max) * 50}%`, background: "#c8a97e", marginLeft: "auto" }} />
        <div style={{ width: 2, background: "#fff" }} />
        <div style={{ width: `${(valB / max) * 50}%`, background: "#8aaa80" }} />
      </div>
    </div>;
  };

  const PerfumePanel = ({ p, side }) => {
    if (!p) return <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: "#ccc", fontSize: 14, padding: 24 }}>
      Pick a perfume
    </div>;

    const allTags = p.tags || [];
    const prims = new Set(p.primary || []);

    return <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ marginBottom: 12 }}>
        <div className="card-house">{p.house}</div>
        <div style={{ fontSize: 17, fontWeight: 700, color: "#2d2926", lineHeight: 1.2, marginBottom: 4 }}>
          {p.name}{p.concentration ? <span style={{ fontWeight: 400, color: "#888", fontSize: 14 }}> {p.concentration}</span> : ""}
        </div>
        <div style={{ fontSize: 12, color: "#aaa", marginBottom: 6 }}>{p.family}</div>
        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
          {p.gender && <span style={genderStyle(p.gender)}>{p.gender}</span>}
          {p.rating != null && <span style={{ fontSize: 13, fontWeight: 600, color: p.rating >= 9 ? "#c8a97e" : p.rating >= 8 ? "#8aaa80" : "#999" }}>{p.rating}/10</span>}
          {p.preference && p.preference !== "Unrated" && <span style={{ fontSize: 11, color: "#aaa" }}>{p.preference}</span>}
        </div>
      </div>

      {/* Mood + wear */}
      <div style={{ fontSize: 11, color: "#bbb", marginBottom: 10, display: "flex", gap: 10 }}>
        {p.wearCount > 0 && <span>Worn {p.wearCount}×</span>}
        {p.daysAgo != null && <span>{fmtAge(p.daysAgo)}</span>}
      </div>

      {/* Notes */}
      {allTags.length > 0 && <div className="tag-row" style={{ flexWrap: "wrap" }}>
        {/* Primary notes first */}
        {[...allTags].sort((x, y) => {
          const xp = prims.has(x), yp = prims.has(y);
          const xs = sharedTags.has(x), ys = sharedTags.has(y);
          if (xp && yp) return 0;
          if (xp) return -1; if (yp) return 1;
          if (xs && ys) return 0;
          if (xs) return -1; if (ys) return 1;
          return 0;
        }).map(t => <span key={t} style={{ fontSize: 11, padding: "3px 8px", borderRadius: 8, display: "inline-block", margin: "2px", ...tagStyle(t, p) }}>{t}</span>)}
      </div>}
    </div>;
  };

  return <div>
    <h1 className="page-title">Compare</h1>
    <p className="page-sub">Side-by-side note breakdown. Shared notes are highlighted.</p>

    {/* Selectors */}
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 20 }}>
      <div>
        <input type="search" placeholder="Search A…" value={queryA} onChange={e => setQueryA(e.target.value)} style={{ width: "100%", marginBottom: 6, boxSizing: "border-box" }} />
        <select value={idA ?? ""} onChange={e => setIdA(e.target.value === '' ? null : parseInt(e.target.value))} style={{ width: "100%", padding: "10px 12px", fontSize: 13, fontFamily: "inherit", border: "1px solid #ddd", background: "#fff", minHeight: 44, boxSizing: "border-box" }}>
          <option value="">— Perfume A —</option>
          {filtered(queryA).map(p => <option key={p.id} value={p.id}>{p.fullName}</option>)}
        </select>
      </div>
      <div>
        <input type="search" placeholder="Search B…" value={queryB} onChange={e => setQueryB(e.target.value)} style={{ width: "100%", marginBottom: 6, boxSizing: "border-box" }} />
        <select value={idB ?? ""} onChange={e => setIdB(e.target.value === '' ? null : parseInt(e.target.value))} style={{ width: "100%", padding: "10px 12px", fontSize: 13, fontFamily: "inherit", border: "1px solid #ddd", background: "#fff", minHeight: 44, boxSizing: "border-box" }}>
          <option value="">— Perfume B —</option>
          {filtered(queryB).map(p => <option key={p.id} value={p.id}>{p.fullName}</option>)}
        </select>
      </div>
    </div>

    {/* Legend */}
    {a && b && <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 16, fontSize: 11 }}>
      <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
        <span style={{ width: 12, height: 12, borderRadius: 3, background: "#c8a97e", display: "inline-block" }} /> Primary in both
      </span>
      <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
        <span style={{ width: 12, height: 12, borderRadius: 3, background: "#e8f0e8", border: "1px solid #aaccaa", display: "inline-block" }} /> Shared note
      </span>
      <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
        <span style={{ width: 12, height: 12, borderRadius: 3, background: "#f5f0e8", border: "1px solid #d4bc8a", display: "inline-block" }} /> Primary (one side)
      </span>
      <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
        <span style={{ width: 12, height: 12, borderRadius: 3, background: "#f0ece6", display: "inline-block" }} /> Unique note
      </span>
    </div>}

    {/* Side by side panels */}
    <div style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
      <PerfumePanel p={a} side="a" />
      {a && b && <div style={{ width: 1, background: "#e8e2da", flexShrink: 0, alignSelf: "stretch" }} />}
      <PerfumePanel p={b} side="b" />
    </div>

    {/* Summary stats */}
    {a && b && <div style={{ marginTop: 24, padding: "16px", background: "#faf9f7", border: "1px solid #e8e2da", borderRadius: 12 }}>
      <div className="sec-lbl" style={{ marginBottom: 12 }}>Comparison summary</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, textAlign: "center", marginBottom: 16 }}>
        <div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#c8a97e" }}>{sharedTags.size}</div>
          <div style={{ fontSize: 11, color: "#aaa" }}>shared notes</div>
        </div>
        <div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#8b6f3e" }}>{sharedPrimary.size}</div>
          <div style={{ fontSize: 11, color: "#aaa" }}>shared primaries</div>
        </div>
        <div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#999" }}>{onlyA.length + onlyB.length}</div>
          <div style={{ fontSize: 11, color: "#aaa" }}>unique notes total</div>
        </div>
      </div>

      {/* Character score comparison */}
      <ScoreBar label="Match" valA={a.sigScore || 5} valB={b.sigScore || 5} />
      <ScoreBar label="Intensity" valA={a.intScore || 3} valB={b.intScore || 3} />
      <ScoreBar label="Appeal" valA={a.balScore || 5} valB={b.balScore || 5} />

      {/* Notes only in A */}
      {onlyA.length > 0 && <div style={{ marginTop: 12 }}>
        <div style={{ fontSize: 11, color: "#aaa", marginBottom: 4 }}>Only in {a.name}</div>
        <div className="tag-row" style={{ flexWrap: "wrap" }}>
          {onlyA.map(t => <span key={t} style={{ fontSize: 11, padding: "2px 7px", borderRadius: 8, background: "#f5f0e8", color: "#8b6f3e", border: "1px solid #d4bc8a44", margin: 2 }}>{t}</span>)}
        </div>
      </div>}

      {/* Notes only in B */}
      {onlyB.length > 0 && <div style={{ marginTop: 10 }}>
        <div style={{ fontSize: 11, color: "#aaa", marginBottom: 4 }}>Only in {b.name}</div>
        <div className="tag-row" style={{ flexWrap: "wrap" }}>
          {onlyB.map(t => <span key={t} style={{ fontSize: 11, padding: "2px 7px", borderRadius: 8, background: "#e8f0e8", color: "#4a6a4a", border: "1px solid #aaccaa44", margin: 2 }}>{t}</span>)}
        </div>
      </div>}

      {/* Gender / mood match */}
      <div style={{ marginTop: 12, fontSize: 11, color: "#aaa", display: "flex", gap: 16 }}>
        {a.gender && b.gender && <span>Gender: {a.gender === b.gender ? "✓ match" : a.gender === "unisex" || b.gender === "unisex" ? "~ one unisex" : "✗ different"}</span>}
        {a.tags.includes('airy') !== b.tags.includes('airy') && <span>Weight: {a.tags.includes('airy') ? 'airy' : 'heavier'} vs {b.tags.includes('airy') ? 'airy' : 'heavier'}</span>}
      </div>
    </div>}
  </div>;
}


function TaxonomyView({ onSelect, perfumes }) {
  const [lane, setLane] = useState("Floral");
  const [inclAvoid, setInclAvoid] = useState(true);
  const [primaryOnly, setPrimaryOnly] = useState(false);
  const [sort, setSort] = useState("sigScore");
  const [gender, setGender] = useState("All");
  const tabs = LANE_GROUPS.flatMap(g => g.lanes);

  const res = useMemo(() => {
    const lt = lane.toLowerCase();
    // Broad family tabs (floral, woody, citrus…) are blacklisted from p.primary by design —
    // fall back to p.tags for those so "Key Notes Only" never returns 0 on a valid tab.
    const canBeKeyNote = primaryOnly && !PRIMARY_TAG_BLACKLIST.has(lt);
    return perfumes.filter(p => {
      const tagList = canBeKeyNote ? (p.primary || []) : p.tags;
      return tagList.some(t => t === lt);
    })
      .filter(p => inclAvoid || (p.status !== "Avoid" && p.status !== "Dislike"))
      .filter(p => gender === "All" || p.gender === gender)
      .sort((a,b) => b[sort] - a[sort]);
  }, [lane, inclAvoid, sort, primaryOnly, perfumes, gender]);

  return <div>
    <h1 className="page-title">Taxonomy</h1>
    <p className="page-sub">Browse by note family.</p>

    <div className="tab-scroll">
      {tabs.map(l => <button key={l} className={`tab ${lane === l ? "active" : ""}`} onClick={() => setLane(l)}>{l}</button>)}
    </div>
    <div className="inline-row" style={{marginBottom:12}}>
      <select value={gender} onChange={e => setGender(e.target.value)} style={{flex:1}}><option value="All">All genders</option><option value="feminine">Feminine</option><option value="masculine">Masculine</option><option value="unisex">Unisex</option></select>
    </div>

    <div className="inline-row">
      <select value={sort} onChange={e => setSort(e.target.value)}>
        <option value="sigScore">Match</option>
        <option value="intScore">Edge</option>
        <option value="balScore">Appeal</option>
        <option value="rating">Rating</option>
      </select>
      <button className={`toggle ${!inclAvoid ? "active" : ""}`} onClick={() => setInclAvoid(a => !a)}>{inclAvoid ? "All" : "Hide avoid"}</button>
      <button className={`toggle ${primaryOnly ? "active" : ""}`} onClick={() => setPrimaryOnly(p => !p)}>Key Notes Only</button>
      <span className="count-muted">{res.length}</span>
    </div>

    <div className="grid">{res.map(p => <Card key={p.id} p={p} onClick={onSelect} />)}</div>
    {res.length === 0 && <p className="empty">No entries.</p>}
  </div>;
}

function DiaryEntryForm({ initial, onSave, onCancel, title }) {
  const [form, setForm] = useState(initial);
  const f = (k, v) => setForm(prev => ({...prev, [k]: v}));
  const submit = () => {
    if (!form.perfume || !form.date) return;
    onSave({ ...form, rating: form.rating !== "" && form.rating != null ? parseFloat(form.rating) : null });
  };
  return <div className="form-card">
    <div className="form-title">{title}</div>
    <div className="form-grid">
      <label><span className="mini-lbl">Date</span><input type="date" value={form.date} onChange={e => f("date", e.target.value)} /></label>
      <label><span className="mini-lbl">House</span><input value={form.house||""} onChange={e => f("house", e.target.value)} placeholder="e.g. Diptyque" /></label>
      <label><span className="mini-lbl">Perfume *</span><input value={form.perfume||""} onChange={e => f("perfume", e.target.value)} placeholder="e.g. Fleur de Peau" /></label>
      <label><span className="mini-lbl">Concentration</span><input value={form.concentration||""} onChange={e => f("concentration", e.target.value)} placeholder="EDP / EDT / Extrait" /></label>
      <label><span className="mini-lbl">Rating</span><input type="number" min="0" max="10" step="0.5" value={form.rating ?? ""} onChange={e => f("rating", e.target.value)} placeholder="x/10" /></label>
      <label className="full-span"><span className="mini-lbl">{(CONFIG.partnerName || "Partner") + "'s Reaction"}</span><input value={form.safeReaction||""} onChange={e => f("safeReaction", e.target.value)} placeholder="positive / negative / —" /></label>
      <label className="full-span"><span className="mini-lbl">Notes</span><textarea value={form.notes||""} onChange={e => f("notes", e.target.value)} placeholder="Opening, drydown, longevity…" /></label>
    </div>
    <div className="form-actions">
      <button className="btn-primary" onClick={submit}>Save</button>
      <button className="btn-ghost" onClick={onCancel}>Cancel</button>
    </div>
  </div>;
}

function DiaryView({ wearLog, onAdd, onEdit, onDelete, syncStatus }) {
  const [showForm, setShowForm] = useState(false);
  const [editingEntry, setEditingEntry] = useState(null);
  const [filter, setFilter] = useState("");

  const sorted = useMemo(() => [...wearLog].sort((a,b) => new Date(b.date) - new Date(a.date)), [wearLog]);
  const filtered = useMemo(() => filter ? sorted.filter(e => (e.perfume + " " + e.house + " " + (e.notes||"")).toLowerCase().includes(filter.toLowerCase())) : sorted, [sorted, filter]);

  const fmtDate = d => { const dt = new Date(d + "T12:00:00"); return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };

  const handleAdd = (entry) => { onAdd(entry); setShowForm(false); };
  const handleEdit = (updated) => { onEdit(editingEntry, updated); setEditingEntry(null); };
  const handleDelete = (entry) => { if (window.confirm(`Delete entry for ${entry.perfume}?`)) onDelete(entry); };

  // Seed entries can't be edited/deleted (they're baked into the file)
  const isUserEntry = (entry) => !WEAR_LOG_SEED.includes(entry);

  return <div>
    <h1 className="page-title">Wear Diary</h1>
    <p className="page-sub">{sorted.length} entries · {syncStatus}</p>

    <div className="diary-controls">
      <input className="search-input" placeholder="Search diary…" value={filter} onChange={e => setFilter(e.target.value)} />
      <button className="btn-primary" onClick={() => { setShowForm(f => !f); setEditingEntry(null); }}>{showForm ? "Cancel" : "+ Add"}</button>
    </div>

    {showForm && <DiaryEntryForm
      title="New Entry"
      initial={{ date: new Date().toISOString().slice(0,10), perfume: "", house: "", concentration: "", rating: "", notes: "", safeReaction: "" }}
      onSave={handleAdd}
      onCancel={() => setShowForm(false)}
    />}

    <div className="diary-list">
      {filtered.map((e, i) => (
        <div key={i} className="diary-entry">
          {editingEntry === e
            ? <DiaryEntryForm title="Edit Entry" initial={{...e, rating: e.rating ?? ""}} onSave={handleEdit} onCancel={() => setEditingEntry(null)} />
            : <div className="diary-row">
                <div className="diary-content">
                  <div className="diary-date">{fmtDate(e.date)}{e.fuzzy && <span className="fuzzy-mark" title="Fuzzy match to collection">~</span>}{e.unmatched && <span className="unmatched-mark" title="Unmatched to collection">?</span>}</div>
                  <div className="diary-name">
                    {e.house && <span className="diary-house">{e.house} — </span>}
                    {e.perfume}
                    {e.concentration && <span className="diary-conc"> {e.concentration}</span>}
                  </div>
                  {e.notes && <div className="diary-notes">{e.notes}</div>}
                  {e.safeReaction && <div className={`safe-line trev-${e.safeReaction.replace(/\s/g,'-')}`}>{(CONFIG.partnerName || "Partner")}: {e.safeReaction}</div>}
                  {isUserEntry(e) && <div className="entry-actions">
                    <button className="entry-action-btn" onClick={() => { setEditingEntry(e); setShowForm(false); }}>Edit</button>
                    <button className="entry-action-btn del" onClick={() => handleDelete(e)}>Delete</button>
                  </div>}
                </div>
                {e.rating != null && <div className="diary-rating" style={{ color: e.rating >= 9 ? "#c8a97e" : e.rating >= 8 ? "#8aaa80" : "#999" }}>{e.rating}<span className="rating-of">/10</span></div>}
              </div>
          }
        </div>
      ))}
    </div>
  </div>;
}

function WishlistView({ wishlist, onAdd, onRemove }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ house: "", name: "", concentration: "", note: "" });
  const submit = () => {
    if (!form.house || !form.name) return;
    onAdd({ ...form });
    setForm({ house: "", name: "", concentration: "", note: "" });
    setShowForm(false);
  };

  return <div>
    <h1 className="page-title">Wishlist</h1>
    <p className="page-sub">{wishlist.length} to hunt down</p>

    <button className="btn-primary" onClick={() => setShowForm(f => !f)} style={{marginBottom: 20}}>{showForm ? "Cancel" : "+ Add to Wishlist"}</button>

    {showForm && (
      <div className="form-card">
        <div className="form-title">New Wishlist Item</div>
        <div className="form-grid">
          <label><span className="mini-lbl">House *</span><input value={form.house} onChange={e => setForm(f => ({...f, house: e.target.value}))} placeholder="e.g. Chanel" /></label>
          <label><span className="mini-lbl">Name *</span><input value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} placeholder="e.g. No. 22" /></label>
          <label><span className="mini-lbl">Concentration</span><input value={form.concentration} onChange={e => setForm(f => ({...f, concentration: e.target.value}))} placeholder="EDP / EDT / Extrait" /></label>
          <label className="full-span"><span className="mini-lbl">Why</span><textarea value={form.note} onChange={e => setForm(f => ({...f, note: e.target.value}))} placeholder="Why you want to try it…" /></label>
        </div>
        <div className="form-actions">
          <button className="btn-primary" onClick={submit}>Add</button>
          <button className="btn-ghost" onClick={() => setShowForm(false)}>Cancel</button>
        </div>
      </div>
    )}

    <div className="wishlist-grid">
      {wishlist.map((w, i) => (
        <div key={i} className="wish-card">
          <button className="wish-remove" onClick={() => onRemove(i)} title="Remove">×</button>
          <div className="card-house">{w.house}</div>
          <div className="wish-name">{w.name}</div>
          {w.concentration && <div className="card-conc">{w.concentration}</div>}
          {w.note && <div className="wish-note">{w.note}</div>}
        </div>
      ))}
    </div>
    {wishlist.length === 0 && <p className="empty">Wishlist empty.</p>}
  </div>;
}

  { label: "Synthetic",          keys: ["ambrox","ambroxan","ambroxide","cetalox","iso e super","helvetolide","galaxolide","habanolide","ethylene brassylate","norlimbanol","ambrocenide","timbersilk","synthetic"] },
];

// Word-boundary key match: key must appear as a whole word within note.
// "rose".includes("rose") ✓  "tuberose".includes("rose") ✓ but wordKeyMatch → ✗
// Prevents "tuberose" from voting for Rose, "smoky" from matching "smoke", etc.
function wordKeyMatch(note, k) {
  const i = note.indexOf(k);
  if (i === -1) return false;
  const prevOk = i === 0 || note[i - 1] === ' ';
  const nextOk = i + k.length === note.length || note[i + k.length] === ' ';
  return prevOk && nextOk;
}

// Curated tea fragrances where tea is the defining theme but the note-based
// detector can't infer it (the tea note is outnumbered by woody/citrus/iris,
// or the name doesn't say "tea" — e.g. Thé Noir 29). Kate-confirmed.
// A per-perfume categoryOverride (edit form) still takes precedence over this.
const TEA_IDS = new Set([
  14,   // Arquiste — Indigo Smoke (lapsang souchong + maté)
  17,   // BDK — Gris Charnel (black tea)
  244,  // Gucci — A Floral Verse (black tea leaves)
  297,  // Imaginary Authors — O, Unknown! (black tea + lapsang)
  342,  // Le Labo — Thé Noir 29 (black tea)
  508,  // Regime des Fleurs — Cacti (black tea + maté)
  563,  // Vilhelm — Dear Polly (ceylon black tea)
]);

function dominantCategory(p) {
  if (!p) return "Other";
  // Manual override set via the edit form always wins.
  if (p.categoryOverride) return p.categoryOverride;
  // Curated tea fragrances the auto-detector can't infer.
  if (TEA_IDS.has(p.id)) return "Tea";
  const primarySet = new Set(p.primary || []);
  const allNotes = new Set([...(p.tags || []), ...(p.primary || [])]);
  let bestLabel = null, bestScore = 0;
  for (const { label, keys } of CATEGORY_MAP) {
    let score = 0;
    if (label === "Musk") {
      // Score 6 when musk is an explicit primary (set by normalizePerfume for
      // musk-named/musk-family perfumes). This ties with two strong primary notes
      // in another category — Musk wins the tie since it's #2 in the map.
      // Score 0 for everything else: musk as a mere base note is too universal.
      score = primarySet.has('musk') ? 6 : 0;
    } else if (label === "Tea") {
      // Tea is a "theme" note: a fragrance can be defined by it even when woody
      // or citrus support notes outnumber it. Weight tea signals heavily — a tea
      // word in the name (+5) or accord family (+4) is a strong authorial cue,
      // and each tea note counts 3 (primary) / 2 (tag) vs the usual 3 / 1.
      const nm = _norm(p.name || p.fullName || "");
      const fam = (p.family || "").toLowerCase();
      let s = 0;
      if (keys.some(k => wordKeyMatch(nm, k))) s += 5;
      if (keys.some(k => wordKeyMatch(fam, k))) s += 4;
      for (const note of allNotes) {
        if (!primarySet.has(note) && PRIMARY_TAG_BLACKLIST.has(note)) continue;
        if (keys.some(k => wordKeyMatch(note, k))) s += primarySet.has(note) ? 3 : 2;
      }
      score = s;
    } else {
      for (const note of allNotes) {
        // Broad descriptor tags (powdery, floral, woody…) are blocked from voting
        // unless the user has explicitly set them as a primary note.
        if (!primarySet.has(note) && PRIMARY_TAG_BLACKLIST.has(note)) continue;
        if (keys.some(k => wordKeyMatch(note, k))) {
          score += primarySet.has(note) ? 3 : 1;
        }
      }
    }
    if (score > bestScore) { bestScore = score; bestLabel = label; }
  }
  if (bestLabel) return bestLabel;
  // Fall back to family string
  const fam = (p.family || "").toLowerCase();
  for (const { label, keys } of CATEGORY_MAP) {
    if (keys.some(k => wordKeyMatch(fam, k))) return label;
  }
  return "Other";
}



function ChartsView({ wearLog, perfumes, wearStats, onRefresh, onSelect }) {
  const [refreshing, setRefreshing] = React.useState(false);
  const [selectedFam, setSelectedFam] = React.useState(null);
  const handleRefresh = React.useCallback(async () => {
    if (!onRefresh || refreshing) return;
    setRefreshing(true);
    try { await onRefresh(); } finally { setRefreshing(false); }
  }, [onRefresh, refreshing]);
  const enriched = useMemo(() => enrich(perfumes, wearStats), [perfumes, wearStats]);
  const BROAD_FAM = ["floral","woody","citrus","amber","musk","resinous","gourmand",
    "leather","aromatic","aquatic","chypre","fruity","green","oriental"];
  const FAM_COLORS = {
    floral:'var(--dusty-rose)', woody:'#a07855', citrus:'#c8b560', amber:'var(--gold)',
    musk:'#b0a8a0', resinous:'#8a6545', gourmand:'#c87a9a', leather:'#7a5a3a',
    aromatic:'var(--sage)', aquatic:'#6a9ab0', chypre:'var(--lilac)', fruity:'#c87060',
    green:'#7aaa6a', oriental:'#9b6888'
  };
  const CAT_COLORS = {
    'Rose':'var(--dusty-rose)', 'Musk':'#b0a8a0', 'Iris / Powdery':'#c4b8d4',
    'Incense / Oud':'#8a6545', 'White Floral':'#e8ddd0', 'Yellow Floral':'#c8b560',
    'Purple Floral':'var(--lilac)', 'Floral':'#d4a0b0', 'Green / Fresh':'#7aaa6a', 'Aromatic':'#8aaa70',
    'Citrus':'#c8b040', 'Fruity':'#c87060', 'Woody':'#a07855', 'Tea':'#8aa86a',
    'Amber / Resin':'var(--gold)', 'Powder':'#d4c4b8', 'Leather / Animalic':'#7a5a3a',
    'Gourmand':'#c87a9a', 'Spice':'#b06040', 'Synthetic':'#8c9aa6', 'Other':'#aaa'
  };
  const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const perfMap = useMemo(() => {
    const m = new Map();
    for (const p of perfumes) m.set(p.id, p);
    return m;
  }, [perfumes]);

  const mk = date => {
    if (!date) return null;
    const s = typeof date==='string' ? date : new Date(date).toISOString();
    return s.slice(0,7);
  };
  const fmtMk = k => k ? `${MO[parseInt(k.split('-')[1])-1]} '${k.split('-')[0].slice(2)}` : '';

  // NOTE palette — 7 distinct colours cycling through the app's accent set
  const NOTE_PALETTE = ['var(--gold)','var(--sage)','var(--dusty-rose)','var(--lilac)',
    '#6a9ab0','#a07855','#c8b560','#9a6a8a','#7faa85','#b58a6a','#6a7a9a'];

  // Chart-ready note list per perfume: use ONLY each perfume's defining primary notes
  // (3–7 signature ingredients), not the full tag pyramid. Counting every pyramid note
  // made one wear contribute to ~15–21 notes at once, so the same bottles reappeared
  // under nearly every note. p.primary already strips broad families via
  // PRIMARY_TAG_BLACKLIST; we additionally drop the few surviving descriptors (powder,
  // resin, musk, mineral...) via NOTES_CHART_BLACKLIST so every note shown is a
  // specific ingredient at the same granularity.
  const chartNotes = p => (Array.isArray(p.primary) ? p.primary : []).filter(n => !NOTES_CHART_BLACKLIST.has(n));
  // Format a {perfumeName: count} map into a newline list for chart hover tooltips
  const fmtNodePerf = m => m ? Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,c])=>c>1?`${n} ×${c}`:n).join('\n') : '';

  // 1. NOTES OVER TIME — top notes by total wear frequency, tracked month-by-month
  const notesOverTime = useMemo(() => {
    const totalByNote = {};
    for (const e of wearLog) {
      const p = perfMap.get(e.perfumeId); if (!p) continue;
      const notes = chartNotes(p);
      for (const note of notes) if (note) totalByNote[note]=(totalByNote[note]||0)+1;
    }
    // top 7 characterful notes across all diary entries
    const topNotes = Object.entries(totalByNote)
      .sort(([,a],[,b])=>b-a).slice(0,10).map(([n])=>n);
    // build per-month counts
    const allMks = new Set(), byMkNote = {}, byMkNotePerf = {};
    for (const e of wearLog) {
      const key = mk(e.date); if (!key) continue;
      const p = perfMap.get(e.perfumeId); if (!p) continue;
      const notes = chartNotes(p);
      allMks.add(key);
      if (!byMkNote[key]) { byMkNote[key]={}; byMkNotePerf[key]={}; }
      for (const note of topNotes) {
        if (notes.includes(note)) {
          byMkNote[key][note]=(byMkNote[key][note]||0)+1;
          const pm = byMkNotePerf[key][note] = byMkNotePerf[key][note]||{};
          const nm = p.house+" — "+p.name;
          pm[nm]=(pm[nm]||0)+1;
        }
      }
    }
    const months = [...allMks].sort();
    const data = months.map(key=>({key,label:fmtMk(key),
      ...Object.fromEntries(topNotes.map(n=>[n,(byMkNote[key]||{})[n]||0])),
      _perf:Object.fromEntries(topNotes.map(n=>[n,fmtNodePerf((byMkNotePerf[key]||{})[n])]))}));
    return {topNotes, data};
  }, [wearLog, perfMap]);

  // 1b. SCENT DNA — top 10 specific notes by total wear count, no time axis.
  // Snapshot of what your nose actually reaches for, at the same ingredient-level
  // granularity as Notes Over Time, but easier to read since it's not split into months.
  const scentDNA = useMemo(() => {
    const totalByNote = {};
    for (const e of wearLog) {
      const p = perfMap.get(e.perfumeId); if (!p) continue;
      for (const note of chartNotes(p)) if (note) totalByNote[note]=(totalByNote[note]||0)+1;
    }
    return Object.entries(totalByNote).sort(([,a],[,b])=>b-a).slice(0,10)
      .map(([note,n])=>({label:note.charAt(0).toUpperCase()+note.slice(1), value:n}));
  }, [wearLog, perfMap]);

  // 1c. NOTE CLUSTERS OVER TIME — like Notes Over Time, but grouped into broader,
  // consistent-granularity clusters (NOTE_CLUSTERS) so it reads at a different zoom
  // level than both the single-note chart and the whole-family chart.
  const clusterOverTime = useMemo(() => {
    const clusterOf = p => {
      // Primary notes only — keeps each perfume in just its defining clusters rather
      // than every cluster its full pyramid happens to touch.
      const prims = new Set(p.primary||[]);
      return NOTE_CLUSTERS.filter(c => c.keys.some(k => prims.has(k))).map(c => c.label);
    };
    const allMks = new Set(), byMkCluster = {}, totals = {}, byMkClusterPerf = {};
    for (const e of wearLog) {
      const key = mk(e.date); if (!key) continue;
      const p = perfMap.get(e.perfumeId); if (!p) continue;
      const clusters = clusterOf(p);
      allMks.add(key);
      if (!byMkCluster[key]) { byMkCluster[key] = {}; byMkClusterPerf[key] = {}; }
      for (const c of clusters) {
        byMkCluster[key][c] = (byMkCluster[key][c]||0)+1;
        totals[c] = (totals[c]||0)+1;
        const pm = byMkClusterPerf[key][c] = byMkClusterPerf[key][c]||{};
        const nm = p.house+" — "+p.name;
        pm[nm]=(pm[nm]||0)+1;
      }
    }
    const topClusters = NOTE_CLUSTERS.map(c=>c.label).filter(l=>totals[l]>0)
      .sort((a,b)=>totals[b]-totals[a]);
    const months = [...allMks].sort();
    const data = months.map(key=>({key,label:fmtMk(key),
      ...Object.fromEntries(topClusters.map(c=>[c,(byMkCluster[key]||{})[c]||0])),
      _perf:Object.fromEntries(topClusters.map(c=>[c,fmtNodePerf((byMkClusterPerf[key]||{})[c])]))}));
    return {topNotes: topClusters, data};
  }, [wearLog, perfMap]);

  // 2. EXPLORER → CURATOR — new tries vs rewears per month
  const explorerCurator = useMemo(() => {
    const seen = {}, byMk = {};
    const sorted = [...wearLog].filter(e=>e.date)
      .sort((a,b)=>mk(a.date).localeCompare(mk(b.date)));
    for (const e of sorted) {
      const key = mk(e.date); if (!key) continue;
      if (!byMk[key]) byMk[key] = {newTry:0,rewear:0};
      if (seen[e.perfumeId]) byMk[key].rewear++;
      else { seen[e.perfumeId]=key; byMk[key].newTry++; }
    }
    return Object.entries(byMk).sort(([a],[b])=>a.localeCompare(b))
      .map(([key,{newTry,rewear}])=>({key,label:fmtMk(key),newTry,rewear,total:newTry+rewear}));
  }, [wearLog]);

  // 3. HOUSE BATTING AVERAGES — diary-based avg rating, 2+ rated wears
  const houseBatting = useMemo(() => {
    // Use each perfume's computed rating (diary-derived or manually set)
    // so that all rated perfumes count toward their house average,
    // not just those with diary entries.
    const h = {};
    for (const p of enriched) {
      if (p.rating == null || isNaN(+p.rating)) continue;
      if (!p.house) continue;
      if (!h[p.house]) h[p.house] = { sum: 0, n: 0 };
      h[p.house].sum += +p.rating; h[p.house].n++;
    }
    return Object.entries(h).filter(([,{n}]) => n >= 4)
      .map(([house,{sum,n}]) => ({ label: house, avg: +(sum/n).toFixed(1), n }))
      .sort((a,b) => b.avg - a.avg || b.n - a.n).slice(0, 12);
  }, [enriched]);

  // 4. OLFACTORY FAMILIES — tag-based collection count
  const familyCollection = useMemo(() => {
    const c = {};
    for (const p of perfumes) {
      const cat = dominantCategory(p);
      c[cat] = (c[cat] || 0) + 1;
    }
    return Object.entries(c).sort(([,a],[,b])=>b-a)
      .map(([cat,n])=>({label:cat, fam:cat, value:n, color:CAT_COLORS[cat]||'var(--gold)'}));
  }, [perfumes]);

  // 5. OLFACTORY FAMILIES OVER TIME — monthly wear counts by family
  const famOverTime = useMemo(() => {
    const allMks = new Set(), byMkFam = {}, byMkFamPerf = {};
    for (const e of wearLog) {
      const key = mk(e.date); if (!key) continue;
      const p = perfMap.get(e.perfumeId); if (!p) continue;
      allMks.add(key);
      if (!byMkFam[key]) { byMkFam[key] = {}; byMkFamPerf[key] = {}; }
      const cat = dominantCategory(p);
      byMkFam[key][cat] = (byMkFam[key][cat] || 0) + 1;
      const pm = byMkFamPerf[key][cat] = byMkFamPerf[key][cat]||{};
      const nm = p.house+" — "+p.name;
      pm[nm]=(pm[nm]||0)+1;
    }
    const months = [...allMks].sort();
    const totals = {};
    for (const fc of Object.values(byMkFam))
      for (const [f,n] of Object.entries(fc)) totals[f]=(totals[f]||0)+n;
    const topFams = Object.entries(totals).sort(([,a],[,b])=>b-a).slice(0,6).map(([f])=>f);
    const data = months.map(key=>({key,label:fmtMk(key),
      ...Object.fromEntries(topFams.map(f=>[f,(byMkFam[key]||{})[f]||0])),
      _perf:Object.fromEntries(topFams.map(f=>[f,fmtNodePerf((byMkFamPerf[key]||{})[f])]))}));
    return {months, topFams, data};
  }, [wearLog, perfMap]);

  // 6. RATING JOURNEYS — sparklines for big taste shifts (needs enriched for ratingHistory)
  const journeys = useMemo(() =>
    enriched.filter(p=>p.ratingHistory?.length>=2&&p.ratingDelta!=null&&p.ratingDelta!==0)
      .sort((a,b)=>Math.abs(b.ratingDelta)-Math.abs(a.ratingDelta)).slice(0,14)
  , [enriched]);

  // 7. MOST WORN — top fragrances by diary count
  const mostWorn = useMemo(() =>
    enriched.filter(p=>p.wearCount>0)
      .sort((a,b)=>b.wearCount-a.wearCount||b.ratingHistory.slice(-1)[0]?.rating-a.ratingHistory.slice(-1)[0]?.rating)
      .slice(0,14)
  , [enriched]);

  // 8. RATING × WEARS SCATTER — each worn perfume as a dot
  // 8. SEASONAL WEAR PATTERNS — which families dominate each season
  const SEASONS = [
    {key:'winter', label:'Winter', months:[12,1,2], color:'#7a9bb5'},
    {key:'spring', label:'Spring', months:[3,4,5],  color:'var(--dusty-rose)'},
    {key:'summer', label:'Summer', months:[6,7,8],  color:'var(--gold)'},
    {key:'fall',   label:'Autumn', months:[9,10,11], color:'#a07855'},
  ];
  const seasonOf = date => {
    const mo = new Date(date).getMonth()+1;
    return SEASONS.find(s=>s.months.includes(mo))?.key || null;
  };
  const seasonalData = useMemo(() => {
    // count family tag occurrences per season from wear log
    const bySeason = {};
    for (const s of SEASONS) bySeason[s.key] = {};
    for (const e of wearLog) {
      const sk = seasonOf(e.date); if (!sk) continue;
      const p = perfMap.get(e.perfumeId); if (!p) continue;
      const tags = Array.isArray(p.tags) ? p.tags : [];
      for (const f of BROAD_FAM) {
        if (tags.includes(f)) bySeason[sk][f] = (bySeason[sk][f]||0)+1;
      }
    }
    return SEASONS.map(s => {
      const counts = bySeason[s.key];
      const total = Object.values(counts).reduce((a,b)=>a+b,0);
      const top = Object.entries(counts).sort(([,a],[,b])=>b-a).slice(0,6)
        .map(([f,n])=>({fam:f, label:f.charAt(0).toUpperCase()+f.slice(1), n, pct:total?Math.round((n/total)*100):0}));
      return {...s, top, total};
    });
  }, [wearLog, perfMap]);

  // ── Render helpers ─────────────────────────────────────────────────────────

  const HBar = ({label, value, max, color, sub, onClick}) => (
    <div onClick={onClick||undefined}
      style={{display:'flex',alignItems:'center',gap:10,marginBottom:9,
        cursor: onClick ? 'pointer' : 'default'}}>
      <div title={label}
        style={{width:150,textAlign:'right',fontSize:11,flexShrink:0,
          whiteSpace:'normal',wordBreak:'break-word',lineHeight:1.25,fontFamily:'Georgia,serif',
          color: onClick ? 'var(--gold)' : 'var(--fg-soft)',
          textDecoration: onClick ? 'underline dotted' : 'none'}}>{label}</div>
      <div style={{flex:1,height:10,background:'var(--bg-soft)',borderRadius:1,overflow:'hidden'}}>
        <div style={{width:`${Math.round((value/max)*100)}%`,height:'100%',
          background:color||'var(--gold)',opacity:0.7,transition:'width .3s'}}/>
      </div>
      <div style={{width:38,fontSize:10,color:'var(--fg-mute)',flexShrink:0,
        fontFamily:'Georgia,serif',textAlign:'right'}}>{sub||value}</div>
    </div>
  );

  // SVG multi-line — Notes over time
  const NotesTimeChart = ({topNotes, data}) => {
    if (!data.length||!topNotes.length) return <p style={{color:'var(--fg-mute)',fontSize:12,fontFamily:'Georgia,serif',marginTop:12}}>Not enough diary data yet.</p>;
    const W=520,H=100,PL=18,PR=14,PT=10,PB=52;
    const iW=W-PL-PR, iH=H;
    const maxV=Math.max(...data.flatMap(d=>topNotes.map(n=>d[n]||0)),1);
    const xS=data.length>1?iW/(data.length-1):0;
    const skip=data.length>10?Math.ceil(data.length/8):1;
    const pts=(note)=>data.map((d,i)=>[PL+(data.length===1?iW/2:i*xS), PT+(1-(d[note]||0)/maxV)*iH]);
    return (
      <svg viewBox={`0 0 ${W} ${H+PT+PB}`} style={{width:'100%',display:'block',overflow:'visible'}}>
        {[0,Math.round(maxV/2),maxV].map((v,i)=>{
          const y=PT+(1-v/maxV)*iH;
          return <line key={i} x1={PL} x2={W-PR} y1={y} y2={y} stroke="var(--border)" strokeWidth={0.4} strokeDasharray="3 3"/>;
        })}
        {topNotes.map((note,ni)=>{
          const col=NOTE_PALETTE[ni%NOTE_PALETTE.length];
          const ps=pts(note);
          const d=ps.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
          return (
            <g key={note}>
              <path d={d} fill="none" stroke={col} strokeWidth={1.6} strokeLinejoin="round" strokeLinecap="round" opacity={0.82}/>
              {ps.map(([x,y],i)=>(
                <circle key={i} cx={x} cy={y} r={2.2} fill={col} opacity={0.9}/>
              ))}
            </g>
          );
        })}
        {/* Merged hover layer: coincident nodes share one tooltip so overlapping
            points all surface, not just the topmost circle. */}
        {(() => {
          const groups = {};
          topNotes.forEach((note)=>pts(note).forEach(([x,y],i)=>{
            const k=i+'|'+Math.round(y);
            (groups[k]=groups[k]||{x,y,i,items:[]}).items.push(
              `${note}: ${data[i][note]||0} wears${data[i]._perf&&data[i]._perf[note]?' ('+data[i]._perf[note].replace(/\n/g,', ')+')':''}`
            );
          }));
          return Object.values(groups).map((g,gi)=>(
            <circle key={'h'+gi} cx={g.x} cy={g.y} r={5} fill="transparent" style={{pointerEvents:'all'}}>
              <title>{`${data[g.i].label}\n${g.items.join('\n')}`}</title>
            </circle>
          ));
        })()}
        {data.map((d,i)=>i%skip===0&&(

            textAnchor="middle" fontSize={8} fill="var(--fg-very-soft)" fontFamily="Georgia,serif"
            transform={`rotate(-40,${PL+(data.length===1?iW/2:i*xS)},${H+PT+PB-2})`}>{d.label}</text>
        ))}
      </svg>
    );
  };

  // SVG stacked bars — Explorer → Curator
  const ExplorerChart = ({data}) => {
    if (!data.length) return null;
    const W=520,H=90,PB=56;
    const maxT=Math.max(...data.map(d=>d.total),1);
    const bw=Math.max(14,Math.floor((W-20)/data.length)-4);
    const skip=data.length>10?Math.ceil(data.length/8):1;
    return (
      <svg viewBox={`0 0 ${W} ${H+PB}`} style={{width:'100%',display:'block',overflow:'visible'}}>
        <rect x={W-78} y={4} width={8} height={8} fill="var(--gold)" opacity={0.7} rx={1}/>
        <text x={W-67} y={11} fontSize={8} fill="var(--fg-soft)" fontFamily="Georgia,serif">First wear</text>
        <rect x={W-78} y={16} width={8} height={8} fill="var(--sage)" opacity={0.7} rx={1}/>
        <text x={W-67} y={23} fontSize={8} fill="var(--fg-soft)" fontFamily="Georgia,serif">Rewear</text>
        {data.map((d,i)=>{
          const x=10+i*(bw+4);
